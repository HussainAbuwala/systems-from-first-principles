# Stage 2: nginx terminates HTTPS and forwards to the shortener inside the
# machine. Everything else stays at Ubuntu's nginx defaults (worker_processes
# auto = one worker per vCPU).
upstream shortener {
    server 127.0.0.1:8080;
    keepalive 32;                      # reuse local connections to Node
}

server {
    listen 443 ssl default_server;
    ssl_certificate     /opt/sfp/tls/cert.pem;
    ssl_certificate_key /opt/sfp/tls/key.pem;

    location / {
        proxy_pass http://shortener;
        proxy_http_version 1.1;        # needed for keepalive to the upstream
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
