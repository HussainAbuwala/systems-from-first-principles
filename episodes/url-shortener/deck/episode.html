<title>URL Shortener Episode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: two views of one episode. Read = a running order you review top to bottom (board thumbnail + what you say). Present = one full-width board you click through on camera. Single light theme on purpose: the notation is ink on a white board. */
:root{
  --page:#f4f4f2; --board:#ffffff; --ink:#111111; --grey:#9a9a9a; --soft:#5c5c5c; --line:#e0e0dc; --red:#d1291f;
  --text:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
body{ background:var(--page); color:var(--ink); font:16px/1.6 var(--text); }
.wrap{ max-width:1180px; margin:0 auto; padding-inline:24px; padding-block:32px 72px; display:grid; gap:28px; }
header{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px 24px; flex-wrap:wrap; }
header .t{ display:grid; gap:6px; min-width:0; }
h1{ font:500 clamp(26px,3.2vw,36px)/1.15 var(--text); margin:0; letter-spacing:-.01em; }
header p{ margin:0; color:var(--soft); max-width:64ch; }
.mono{ font-family:var(--mono); }
.tabs{ display:inline-flex; border:1px solid var(--ink); border-radius:6px; overflow:hidden; }
.tabs button{ font:500 14px var(--text); background:var(--board); color:var(--ink); border:0; padding:8px 18px; cursor:pointer; }
.tabs button[aria-selected="true"]{ background:var(--ink); color:var(--board); }
button:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
.facts{ display:flex; flex-wrap:wrap; gap:8px 28px; font:400 14px var(--mono); color:var(--soft); }
.facts b{ color:var(--ink); font-weight:500; }

/* Read view */
.chapter{ display:grid; gap:14px; }
.chapter h2{ font:500 22px/1.25 var(--text); margin:12px 0 0; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
.chapter h2 span{ font:400 13px var(--mono); color:var(--grey); }
.beat{ display:grid; grid-template-columns:minmax(0,44%) minmax(0,1fr); gap:22px; background:var(--board); border:1px solid var(--line); padding:14px; }
.beat .thumb{ all:unset; cursor:pointer; display:block; min-width:0; }
.beat .thumb canvas{ display:block; width:100%; aspect-ratio:16/9; border:1px solid var(--line); }
.beat .thumb:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
.beat .body{ display:grid; gap:10px; align-content:start; min-width:0; }
.beat .head{ display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
.beat .n{ font:400 13px var(--mono); color:var(--grey); }
.beat h3{ font:500 18px/1.3 var(--text); margin:0; }
.beat .dur{ font:400 13px var(--mono); color:var(--grey); margin-left:auto; }
.beat .say{ margin:0; font-size:16px; line-height:1.6; border-left:2px solid var(--ink); padding-left:14px; }
.beat .meta{ display:flex; flex-wrap:wrap; gap:6px 18px; font:400 13px var(--mono); color:var(--soft); }
.beat .meta b{ font-weight:500; color:var(--ink); }
.beat .note{ margin:0; font-size:14px; color:var(--soft); }

/* Present view */
.stage{ display:grid; gap:12px; }
.screen{ background:var(--board); border:1px solid var(--line); }
.screen canvas{ display:block; width:100%; aspect-ratio:16/9; max-width:100%; cursor:pointer; }
.screen:fullscreen{ display:flex; align-items:center; justify-content:center; background:#fff; border:0; }
.screen:fullscreen canvas{ width:auto; height:100%; max-width:100%; max-height:100%; }
.bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; font-size:14px; }
.btn[aria-pressed="true"]{ background:var(--ink); color:var(--board); }
.screen canvas.laser{ cursor:crosshair; touch-action:none; }
.btn{ font:500 14px var(--text); background:var(--board); color:var(--ink); border:1px solid var(--ink); border-radius:6px; padding:6px 14px; cursor:pointer; }
.jump{ font:400 14px var(--text); color:var(--ink); background:var(--board); border:1px solid var(--ink); border-radius:6px; padding:6px 8px; max-width:min(100%,420px); }
.jump:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
.pos{ font:400 13px var(--mono); color:var(--soft); font-variant-numeric:tabular-nums; }
.keys{ margin-left:auto; font:400 12px var(--mono); color:var(--grey); }
.notes{ background:var(--board); border:1px solid var(--line); padding:16px 18px; display:grid; gap:8px; }
.notes .say{ margin:0; font-size:18px; line-height:1.6; }
.notes .meta{ font:400 13px var(--mono); color:var(--soft); }
@media (max-width:820px){ .beat{ grid-template-columns:1fr; } .keys{ margin-left:0; } }
@media (max-width:440px){ .wrap{ padding-inline:16px; } }
</style>

<div class="wrap">
  <header>
    <div class="t">
      <h1>URL shortener · the episode</h1>
      <p>Every beat of the video in order: what’s on the board, what you say, and which run each number comes from. Read it top to bottom, then switch to Present to click through it out loud.</p>
    </div>
    <div class="tabs" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tab-read" aria-selected="true">Read</button>
      <button type="button" role="tab" id="tab-present" aria-selected="false">Present</button>
    </div>
  </header>
  <div class="facts" id="facts"></div>

  <main id="read"></main>

  <section id="present" class="stage" hidden>
    <div class="screen" id="screen"><canvas id="live" aria-label="Current board"></canvas></div>
    <div class="bar">
      <button class="btn" id="prev" type="button">← Back</button>
      <button class="btn" id="next" type="button">Next →</button>
      <button class="btn" id="pp" type="button">Play</button>
      <button class="btn" id="replay" type="button">Replay</button>
      <button class="btn" id="full" type="button">Full screen</button>
      <button class="btn" id="laser" type="button" aria-pressed="false">Laser off</button>
      <select class="jump" id="jump" aria-label="Go to slide"></select>
      <span class="pos" id="pos"></span>
      <span class="keys">→ / space next · ← back · P play/pause · R replay · N notes · F full screen · L laser</span>
    </div>
    <div class="notes" id="notes"></div>
  </section>
</div>

function head(c,x,y,a,s=12){ c.save(); c.translate(x,y); c.rotate(a); c.beginPath(); c.moveTo(0,0); c.lineTo(-s,-s*.42); c.lineTo(-s,s*.42); c.closePath(); c.fill(); c.restore(); }
function arrow(c,x1,y1,x2,y2,col,w=1.5,dash){ c.strokeStyle=col; c.fillStyle=col; c.lineWidth=w; if(dash) c.setLineDash(dash); const a=Math.atan2(y2-y1,x2-x1); L(c,x1,y1,x2-Math.cos(a)*9,y2-Math.sin(a)*9); c.setLineDash([]); head(c,x2,y2,a); }
function box(c,b,col,w=2){ c.strokeStyle=col; c.lineWidth=w; c.strokeRect(b.x,b.y,b.w,b.h); }
function check(c,x,y,s,col){ c.strokeStyle=col; c.lineWidth=s*.16; c.lineCap='round'; c.lineJoin='round'; c.beginPath(); c.moveTo(x-s*.38,y); c.lineTo(x-s*.1,y+s*.3); c.lineTo(x+s*.42,y-s*.36); c.stroke(); c.lineCap='butt'; }
function cross(c,x,y,s,col){ c.strokeStyle=col; c.lineWidth=s*.15; c.lineCap='round'; L(c,x-s*.34,y-s*.34,x+s*.34,y+s*.34); L(c,x-s*.34,y+s*.34,x+s*.34,y-s*.34); c.lineCap='butt'; }
function runTag(c,s){ T(c,s,W-60,H-34,fm(17),GREY,'right'); }
function heading(c,ev,title,col=INK){ let x=80; if(ev){ x+=T(c,ev,80,104,fm(26,500),INK)+22; } T(c,title,x,104,ft(36),col); }

    arrow(c,G.O.x+G.O.w,G.reqY,G.Ls.x,G.reqY,col('lite'),1.4,[5,5]); arrow(c,G.Ls.x+G.Ls.w,G.reqY,G.V.x,G.reqY,col('vol'),1.4,[5,5]);

// ---------- packets (sampled: one dot ≈ 30 requests)
const RATE=1/30, TA=.6, TB=.45, TC=.8, TD=.8, QROWS=7, QCAP=210;
const waitFor=p=> p<=40?0: clamp(Math.log10(p/40)*.6,0,1.6);
class Sim{ constructor(b){ this.p=[]; this.acc=0; this.cacc=0; this.now=0; this.per=(b&&b.perDot)||30; this.cr=0; }
  mk(s,born,cr){ const w=waitFor(s.redirect)*(.65+.7*Math.random()); const err=Math.random()*100<s.err; return {born,w,err,c:cr?1:0,j:Math.random()-.5,life:TA+w+(err?TD:TB+TC)}; }
  crNow(s){ return (s.cr!=null && this.cr>=0.5)? s.cr : this.cr; }
  warm(s){ this.p=[]; this.acc=0; this.cacc=0; const cr=this.crNow(s), dur=TA+waitFor(s.redirect)*1.35+TB+TC, n=Math.round(Math.max(0,s.rps-cr)/this.per*dur), nc=Math.round(cr/this.per*dur); for(let k=0;k<n;k++) this.p.push(this.mk(s,this.now-Math.random()*dur,0)); for(let k=0;k<nc;k++) this.p.push(this.mk(s,this.now-Math.random()*dur,1)); }
  step(dt,s,live){ this.now+=dt; if(live){ const cr=this.crNow(s); this.acc+=Math.max(0,s.rps-cr)/this.per*dt; this.cacc+=cr/this.per*dt; while(this.acc>=1){ this.acc--; this.p.push(this.mk(s,this.now-Math.random()*dt,0)); } while(this.cacc>=1){ this.cacc--; this.p.push(this.mk(s,this.now-Math.random()*dt,1)); } } this.p=this.p.filter(q=>this.now-q.born<q.life); }
  view(stage){ const pts=[], q=[], ex=entryX(stage), qx=ex-14;
    for(const p of this.p){ let a=this.now-p.born; if(a<0||a>=p.life) continue;
      if(a<TA){ const f=a/TA; pts.push({x:lerp(G.vis+8,qx,f), y:G.reqY+p.j*14*(1-f), c:p.c}); continue; }
      a-=TA; if(a<p.w){ q.push(p); continue; } a-=p.w;
      if(p.err){ const f=a/TD; pts.push({x:qx-12-f*10, y:G.reqY+f*f*150, e:1, o:1-f*f, c:p.c}); continue; }
      if(a<TB){ pts.push({x:lerp(ex+8,turnX,a/TB), y:G.reqY, c:p.c}); continue; }
      a-=TB; const f=a/TC; pts.push(f<.1? {x:turnX,y:lerp(G.reqY,G.resY,f/.1),c:p.c} : {x:lerp(turnX,G.vis+8,(f-.1)/.9), y:G.resY, c:p.c}); }
    q.sort((a,b)=>a.born-b.born); for(let k=0;k<Math.min(q.length,QCAP);k++) pts.push({x:qx-Math.floor(k/QROWS)*13, y:G.reqY-39+(k%QROWS)*13, c:q[k].c});
    return {pts,qn:q.length,qx}; }
}

// ---------- chart for a replay: x = the beat's time segment
function chart(c,b,t){ const g=G.ch, a=b.from, z=b.to, X=tt=>g.x+(tt-a)/(z-a)*g.w, R=RUNS[b.run];
  const metric=b.metric||'redirect';
  c.strokeStyle=INK; c.lineWidth=1; L(c,g.x,g.y+g.h,g.x+g.w,g.y+g.h);
  const span=(z-a)/60, stepM=span>8?2:1; for(let m=Math.ceil(a/60/stepM)*stepM; m*60<=z; m+=stepM){ const x=X(m*60); L(c,x,g.y+g.h,x,g.y+g.h+6); T(c,m+' min',x,g.y+g.h+26,fm(15),GREY,'center'); }
  if(metric==='answered'){
    const S=series(b.run,'answered'), mx=Math.max(...S)*1.12||1, Y=v=>g.y+g.h-v/mx*g.h;
    T(c,'redirects answered per second',g.x,g.y-14,ft(20),INK); [0,Math.round(mx/2/50)*50].forEach(v=>{ T(c,String(v),g.x-14,Y(v)+5,fm(15),GREY,'right'); });
    (b.marks||[]).forEach(m=>{ const x=X(m.t); c.strokeStyle=m.red?RED:GREY; c.lineWidth=1.2; c.setLineDash([5,5]); L(c,x,g.y,x,g.y+g.h); c.setLineDash([]); if(t>=m.t) T(c,m.label,x+(m.left?-8:8),g.y+(m.y||18),fm(15),m.red?RED:INK,m.left?'right':'left'); });
    c.strokeStyle=INK; c.lineWidth=2.4; c.beginPath(); let first=true;
    for(let i=0;i<R.length;i++){ const tc=i*WIN+5; if(tc<a||tc>t) continue; const x=X(tc), y=Y(S[i]); first? c.moveTo(x,y):c.lineTo(x,y); first=false; } c.stroke();
    return; }
  const idx=metric==='create'?2:1, lim=b.limit||(metric==='create'?300:100), Y=p=>g.y+g.h-lf(p)*g.h;
  T(c,metric==='create'?'create p99':'redirect p99',g.x,g.y-14,ft(20),INK);
  [[10,'10 ms'],[100,'100 ms'],[1000,'1 s'],[10000,'10 s']].forEach(([p,l])=>{ T(c,l,g.x-14,Y(p)+5,fm(15),GREY,'right'); c.strokeStyle=GREY; c.lineWidth=1; L(c,g.x-7,Y(p),g.x,Y(p)); });
  c.strokeStyle=RED; c.lineWidth=1.2; c.setLineDash([8,6]); L(c,g.x,Y(lim),g.x+g.w,Y(lim)); c.setLineDash([]); T(c,'limit '+lim+' ms',g.x+g.w,Y(lim)-9,fm(15),RED,'right');
  if(b.ghost){ const GR=RUNS[b.ghost]; c.strokeStyle=GREY; c.lineWidth=1.6; c.beginPath(); let f=true; GR.forEach((w,i)=>{ const tc=i*WIN+5; if(tc<a||tc>z||!w[idx]) return; const x=X(tc),y=Y(w[idx]); f? c.moveTo(x,y):c.lineTo(x,y); f=false; }); c.stroke(); if(b.ghostLabel) T(c,b.ghostLabel,X(lerp(a,z,.45)),Y(b.ghostAt||9000)-12,ft(17),GREY,'center'); }
  const pts=[]; R.forEach((w,i)=>{ const tc=i*WIN+5; if(tc>=a&&tc<=t&&w[idx]) pts.push([X(tc),w[idx]]); }); if(t>a){ const sv=sample(b.run,t)[metric]; if(sv) pts.push([X(t),sv]); }
  c.lineWidth=2.6; c.lineJoin='round';
  for(let i=1;i<pts.length;i++){ const [x1,p1]=pts[i-1],[x2,p2]=pts[i];
    if((p1-lim)*(p2-lim)<0){ const f=(Math.log10(lim)-Math.log10(p1))/(Math.log10(p2)-Math.log10(p1)), xm=lerp(x1,x2,f); c.strokeStyle=p1>=lim?RED:INK; L(c,x1,Y(p1),xm,Y(lim)); c.strokeStyle=p2>=lim?RED:INK; L(c,xm,Y(lim),x2,Y(p2)); }
    else { c.strokeStyle=(p1>=lim&&p2>=lim)?RED:INK; L(c,x1,Y(p1),x2,Y(p2)); } }
  if(pts.length){ const [ex,ep]=pts[pts.length-1], cl=ep>=lim?RED:INK; c.fillStyle=cl; c.beginPath(); c.arc(ex,Y(ep),5,0,Math.PI*2); c.fill(); T(c,ms(ep),Math.min(ex+12,g.x+g.w-90),Y(ep)-10,fm(19,500),cl); }
}

// ---------- replay beat
function drawReplay(c,b,t,sim){
  const s=sample(b.run,t), stage=b.stage;
  heading(c,b.ev,b.head); drawReq(c,b.ev);
  const down=b.down && t>=b.down[0] && t<b.down[1] ? b.down[2] : null;
  drawBoard(c,b,{down, noVis:true});
  if(b.after && t>=b.after[0]) T(c,b.after[1],G.M.x+G.M.w,G.M.y+G.M.h+26,fm(16),INK,'right');
  const v=sim.view(stage);
  for(const p of v.pts){ c.globalAlpha=p.o??1; const col=p.e?RED:INK; c.beginPath(); if(p.c){ c.fillStyle=BOARD; c.strokeStyle=col; c.lineWidth=1.8; c.arc(p.x,p.y,5,0,Math.PI*2); c.fill(); c.stroke(); } else { c.fillStyle=col; c.arc(p.x,p.y,p.e?4.5:3.7,0,Math.PI*2); c.fill(); } } c.globalAlpha=1;
  { const per=sim.per; T(c,'1 dot = '+(per===1?'1 request':per+' requests'),G.vis,H-34,fm(16),GREY); }
  { const w1=T(c,'visitors',G.vis,G.reqY-64,ft(22),INK); T(c,fmtInt(s.rps)+'/s',G.vis+w1+12,G.reqY-64,fm(20),INK); }
  if(b.answered) T(c,'answered '+fmtInt(s.rps*(1-s.err/100))+'/s',G.vis,G.reqY-92,fm(18),s.err>5?RED:INK);
  const lat=s.redirect, slow=lat>=100;
  if(v.qn>0) T(c,(v.qn>QCAP? QCAP+'+':v.qn)+' waiting',v.qx,G.reqY-50,fm(16),slow?RED:INK,'right');
  if(s.err>=.05) T(c,(b.errWord||'timed out')+' '+(s.err<10?s.err.toFixed(1):Math.round(s.err))+'%',Math.min(v.qx-20,G.M.x-14),G.reqY+196,fm(16),RED,'right');
  if(b.res){ const P=G.cpu, cores=stage<3?2:4, val=s.cpu, hot=val>=97;
    T(c,'CPU · '+cores+' cores',P.x,P.y-10,ft(18),INK); c.strokeStyle=INK; c.lineWidth=1.2; c.strokeRect(P.x,P.y,P.w,P.h);
    if(b.split){ let x=P.x, lx=P.x; const NAME={node:'Node',nginx:'nginx',lite:'Litestream'};
      b.split.forEach((k,i)=>{ const v=s[k]||0, w=P.w*clamp(v/(cores*100),0,1), main=i===0, col=main?(hot?RED:INK):GREY;
        c.fillStyle=col; c.fillRect(x,P.y,Math.max(0,w-2),P.h);
        if(w>6){ const lx0=Math.max(x,lx); lx=lx0+T(c, main? NAME[k]+' '+(v/100).toFixed(1)+' cores' : NAME[k], lx0, P.y+P.h+22, fm(main?16:15), col)+16; }
        x+=w; }); }
    else { c.fillStyle=hot?RED:INK; c.fillRect(P.x,P.y,P.w*clamp(val,0,100)/100,P.h); }
    T(c,Math.round(val)+'%',P.x+P.w+12,P.y+15,fm(19),hot?RED:INK); }
  chart(c,b,t);
  if(b.verdict && (t>=b.to-1 || STATIC)){ const x=80+TW(c,b.ev||'',fm(26,500))+22+TW(c,b.head,ft(36))+30; b.verdict==='pass'? check(c,x+12,93,34,INK) : cross(c,x+12,92,32,RED); }
  if(b.footnote) wrap(c,b.footnote,G.M.x,G.M.y+G.M.h+30,860,20,fm(15),GREY);
  if(b.result && (t>=b.to-1 || STATIC)){ // the judged result of this run, in the empty right-hand space
    const x=1236; let y= stage>=6? 440 : 285; const gap= stage>=6? 30 : 38;
    b.result.forEach(([lab,val,note,ok])=>{ const acc=ok==='a', col= acc? GREY : ok? INK : RED, f= val.length<=9? fm(30,500) : ft(24);
      T(c,lab,x,y,ft(19),GREY); const w=T(c,val,x,y+38,f,col); acc? cross(c,x+w+24,y+27,22,GREY) : ok? check(c,x+w+24,y+26,24,INK) : cross(c,x+w+24,y+27,22,RED);
      const ny= note? wrap(c,note,x,y+62,W-44-x,20,fm(15),GREY) : y+38; y=ny+gap; }); }
  runTag(c,'run '+b.run+(b.ghost?' · grey: '+b.ghost:''));
}

const EP=[
// ===== Cold open
{ch:'Cold open', name:'The product', kind:'problem', steps:4, sec:40, screen:['301'],
 say:'Paste a long link, get a short one. Click the short one, and the server doesn’t send a page back: just a status, 301, “moved permanently”, and the address to go to. The browser follows it on its own. It’s the most common system design interview question there is, and the textbook answer is one of the most over-built: a separate service just to hand out codes, a cache in front of the database, and a database built to spread across many machines, all before a single link exists.'},
{ch:'Cold open', name:'What short links are for', kind:'uses', sec:15,
 say:'Short links are everywhere: in posts, texts and QR codes where a long link doesn’t fit, with readable names like launch-day, counting who clicked, and now and then a bad link has to be taken down. Our product grows in exactly that order.'},
{ch:'Cold open', name:'The question', kind:'statement', big:'How far does one file on a €5 server get you?', sub:'And what does it take to handle almost a billion clicks a month?', sec:20,
 say:'So let’s do the opposite. Start with one file on a five-euro server, throw real traffic at it, and only add a piece when something actually breaks.'},
{ch:'Cold open', name:'The events, locked first', kind:'events', sec:40, screen:['9 events'],
 say:'Everything that happens to this system was written down and locked before I built anything. Nine events: more traffic, new features, and things going wrong. The design has to answer to them. I don’t get to pick the convenient ones.'},
{ch:'Cold open', name:'Always true, in every event', kind:'rules', steps:2, sec:60, screen:['100 ms','300 ms','0.1%'], src:'event-script.md (starting requirements, default pass criteria)',
 say:'Some rules hold in every single event, whatever it throws at us. The product must do the basics: paste a link, get a code of at most seven letters and digits; open the code, land on the link; an unknown code says not found; HTTPS only, like any real site. Two things must never happen: a confirmed link lost or sent to the wrong page, or one code with two owners. And it must be fast: 99 out of 100 clicks redirect in under a tenth of a second, creating a link under 300 milliseconds, and fewer than one request in a thousand fails. Those times come from Jakob Nielsen, a usability researcher: a tenth of a second feels instant, one second keeps your train of thought, ten seconds and you’ve lost them. And it’s 99 out of 100, not the average, because the average hides the slowest people. Each event then adds its own load, and sometimes one extra rule.'},
{ch:'Cold open', name:'Where the traffic numbers come from', kind:'numbers', steps:6, sec:60, screen:['100/s · 2/s','1,000/s · 20/s','877 million a month'], src:'event-script.md (traffic model); bitly.com/pages/about',
 say:'Every load number in this video comes from one place: Bitly. They report about a hundred billion clicks and two billion new links a year. We take one percent of that, and ten percent: ten billion clicks and two hundred million links a year. Divide by the seconds in a year, and ten percent is about 317 clicks a second, on average. But traffic isn’t flat: at the busiest time of day it’s about three times that, so 951. We round to a thousand clicks and twenty new links a second. Each step also starts with six months of links already stored, half a year’s worth: ten million at one percent, a hundred million at ten. And back to a month: a thousand a second at peak is 333 a second on average, times the seconds in a month: about 877 million clicks.'},
// ===== E01 · launch
{ch:'E01 · launch', name:'E01 card', kind:'card', ev:'E01', type:'Requirement', title:'Launch', what:'1 click a second and a new link about once a minute, with 1,000 links stored.', why:'Day one of any product. Does the simplest possible thing even work?', pass:'', sec:20,
 say:'Event one: launch day. Friends and family: a click a second, a new link about once a minute, a thousand links. The only question is whether the simplest possible thing works at all.'},
{ch:'E01 · launch', name:'The simplest thing that works', kind:'board', build:true, steps:3, head:'v0', stage:0, sec:45, screen:['€5.99/mo','40 GB disk'],
 say:'So what’s the simplest thing that keeps every always-true rule? Version zero. One Node program with a SQLite file inside it, serving HTTPS directly, on Hetzner’s cheapest server: two shared cores, 4 gigabytes of memory and a 40 gigabyte disk, for €5.99 a month.'},
{ch:'E01 · launch', name:'The table, and why base 62', kind:'tables', head:'v0: one table', sec:45, screen:['FXsk = 10,000,000'],
 tables:[{name:'links', isNew:true, cols:['id','url','created_at'], rows:[['10000000','https://news.example.invalid/…/story-10000000','1791123320'],['10000001','https://news.example.invalid/…/story-10000001','1791123320']]}],
 side:['divide by 62 until nothing is left; each remainder is one character:','10,000,000 ÷ 62 = 161,290  r 20 → k','   161,290 ÷ 62 =   2,601  r 28 → s','     2,601 ÷ 62 =      41  r 59 → X','        41 ÷ 62 =       0  r 41 → F','read upwards: FXsk   ·   check: 41·62³ + 59·62² + 28·62 + 20 = 10,000,000'], sideX:120, sideY:440,
 caption:'alphabet: 0–9 a–z A–Z (62 characters) · 7 characters ≈ 3.5 trillion codes · example rows from the seed',
 say:'Here’s the whole database: one table. A row number, the long link, and when it was made. The short code isn’t even stored: it is the row number, written with 62 characters instead of 10. Divide by 62, keep the remainder, and carry on with what’s left until nothing is: ten million becomes F-X-s-k. On every click the server just runs it backwards. That gives us three things for free: a redirect is just “find row ten million”, the fastest lookup a database has; two links can never share a code, because the numbers only count up; and seven characters cover three and a half trillion links.'},

{ch:'E01 · launch', name:'E01 replay: survived', kind:'replay', run:'e01-01', result:[['redirect p99','17.8 ms','limit 100 ms',1],['create p99','27.8 ms','limit 300 ms',1]], stage:0, from:15, to:355, at:350, dur:10, perDot:1, creates:0.02, res:'cpu', ev:'E01', head:'Launch, v0', verdict:'pass', sec:25, screen:['17.8 ms','27.8 ms'], src:'e01-01',

{ch:'E02 · 1% of Bitly', name:'E02 card', kind:'card', ev:'E02', type:'Load', title:'1% of Bitly', what:'100 clicks a second and 2 new links a second, with 10 million links already stored.', why:'A genuinely successful product: about 88 million clicks a month. Most products never get this far.', pass:'', sec:20,

{ch:'E02 · 1% of Bitly', name:'E02 replay: survived', kind:'replay', run:'e02-01', result:[['redirect p99','17.7 ms','limit 100 ms',1],['create p99','26.0 ms','limit 300 ms',1]], perDot:10, creates:2, stage:0, from:15, to:355, at:300, dur:10, res:'cpu', ev:'E02', head:'1% of Bitly, v0', verdict:'pass', sec:25, screen:['100/s','17.7 ms'], src:'e02-01',

{ch:'E03 · custom names', name:'E03 card', kind:'card', ev:'E03', type:'Requirement', title:'Custom names', what:'Creators can pick their own name. 50 people claim the same name at the same instant, 3 times a second, 1,000 rounds in all, on top of E02 traffic.', why:'People want readable links. The hard part is fairness: two people asking for the same name at the same moment.', pass:'exactly one winner every time; the rest told "taken"', sec:20,
 say:'Event three is a feature. Creators can pick their own name, like launch-day. The test: fifty people claim the same name at the same instant, three times a second, a thousand rounds in all. Exactly one may win. The other forty-nine must be told it’s taken.'},
{ch:'E03 · custom names', name:'v0 gives everyone a win', kind:'names', steps:3, sec:40, screen:['50 of 50 “saved”'], src:'e03-01',
 say:'Here’s the request: the same “create a link” call as always, with one extra field, the name. Fifty people send it at the same instant. But version zero was built before names existed. Its code only ever reads the URL, and a field it doesn’t know is silently ignored, not rejected. So each of the fifty gets a brand-new code and a “saved”. All fifty think they won, every round, and launch-day itself goes nowhere.'},
{ch:'E03 · custom names', name:'v1: a names table', kind:'board', stage:1, ev:'E03', head:'v1: a names table', hi:['node','nodeSub'], nodeSub:['links · names'], notes:['Names need a hyphen or 8+ characters,','so they can never look like a generated code.'], sec:30,
 say:'The fix: a separate table for names. A name has to contain a hyphen or be longer than seven characters, so it can never look like a generated code. And because Node handles one request at a time, check-then-save can’t race: nobody can slip in between the check and the save.'},
{ch:'E03 · custom names', name:'The tables at v1', kind:'tables', ev:'E03', head:'v1: a second table', sec:15,
 tables:[{name:'links', cols:['id','url','created_at'], rows:[['10000000','https://news.example.invalid/…/story-10000000','1791123320']]},{name:'names', isNew:true, cols:['name','url','created_at'], rows:[['launch-day','https://example.com/launch','1791126920']]}],
 caption:'a name needs a hyphen or 8+ characters, so it never looks like a number in base 62 · example rows',
 say:'So now there are two tables. Generated links stay exactly as they were. Names live in their own table, looked up by the name itself.'},
{ch:'E03 · custom names', name:'The rerun rule', kind:'grid', upto:1, pending:[2], head:'After every change, rerun every earlier event', sec:25, foot:'A fix that breaks an earlier event isn’t a fix.',
 say:'One rule from here on: after every change, every earlier event runs again, because a fix that breaks something we already passed isn’t a fix. Events one and two still pass. Now event three itself, on version one.'},
{ch:'E03 · custom names', name:'E03 replay on v1: slow clicks', kind:'replay', run:'e03-02', result:[['redirect p99','179.5 ms','limit 100 ms',0],['names','one winner, every round','1,000 rounds',1]], creates:170, cLabel:'name claim or new link', cPlural:'name claims', stage:1, from:15, to:355, at:300, dur:10, res:'cpu', ev:'E03', head:'Custom names, v1', verdict:'fail', nodeSub:['links · names'], sec:30, screen:['172 ms','CPU 34%'], src:'e03-02',
 say:'Names now work: exactly one winner, every round. But ordinary clicks got slow while names were being claimed. 99th percentile: 180 milliseconds. And look at the CPU: about a third. So what’s it waiting for?'},
{ch:'E03 · custom names', name:'Why: one thread, fifty handshakes', kind:'thread',  sec:45, screen:['50 × 1.8 ms'], src:'calib-01, e03-02',
 say:'Every claim is a brand-new HTTPS connection, and Node does every handshake on its one thread, about 1.8 milliseconds each. Fifty arrive at once: about ninety milliseconds where Node can do nothing else. A click that arrives in the middle isn’t lost: it waits in the operating system’s queue until Node is free, and a one-millisecond lookup turns into a ninety-millisecond wait. Averaged over a second the CPU looks fine; the problem lives inside a tenth of a second.'},
{ch:'E03 · custom names', name:'Options', kind:'options', steps:2, ev:'E03', head:'Three ways out', sec:40,
 rows:[['Two copies of the app','Handshakes on both cores, but now two processes can both think a name is free, and two writers share one SQLite file.','no'],['A faster server','One thread is still one thread.','no'],['nginx in front, doing TLS on every core','The app stays single-threaded, so names stay race-free. No application logic changes.','yes']],
 say:'Three options. Run two copies of the app: then two processes can both believe a name is free. Buy a faster server: one thread is still one thread. Or put nginx in front to do the handshakes on every core and leave the app exactly as it is. That’s the smallest change.'},
{ch:'E03 · custom names', name:'With nginx: two workers share each burst', kind:'thread', two:true, sec:30, screen:['≈ 90 ms expected'], src:'stages/02 log (expectation stated before running)',
 say:'Here’s what we expect from nginx. It runs one worker per core, so on two cores each burst is split in half: twenty-five handshakes each, done in about forty-five milliseconds, and Node does no handshakes at all. So the wait should roughly halve. Half of 180 is 90, right around the limit. It may or may not pass.'},

// ===== E04
{ch:'E04 · a viral link', name:'E04 card', kind:'card', ev:'E04', type:'Load', title:'A link goes viral', what:'On top of E02 traffic, one link ramps from 0 to 2,000 clicks a second in a minute, and stays there for 10 minutes.', why:'Short links get shared. One big post can send thousands of people to the same link within a minute.', pass:'the always-true rules for every link, the hot one too', sec:20,
 say:'Event four: a link goes viral. Two thousand clicks a second on one link for ten minutes, on top of everything else. Every click is a different person, so every click is a brand-new HTTPS connection. Will two cores hold?'},
{ch:'E04 · a viral link', name:'E04 replay: the break', kind:'replay', run:'e04-01', result:[['redirect p99','9.4 s','limit 100 ms',0],['errors','18.4%','limit 0.1%',0]], creates:2, stage:2, from:15, to:785, at:300, dur:16, res:'cpu', split:['nginx','node'], ev:'E04', head:'2,000 clicks a second, v2', verdict:'fail', sec:45, screen:['2,000/s','CPU 100%','9 s'], src:'e04-01',
 say:'Up to about a thousand a second, it’s fine. Then the CPU hits a hundred percent, a queue builds at the front door, and the 99th percentile goes to nine seconds. One visit in five gives up. And it isn’t only the viral link: every link is this slow.'},
{ch:'E04 · a viral link', name:'Why: the handshake', kind:'seq', sec:40, screen:['≈ 2 ms per visitor'], src:'e04-01; stages/03 log',
 say:'Where does the CPU go? Not to finding the link: that takes Node about a millisecond. It goes to the handshake. Every new visitor costs about two milliseconds of CPU for the key exchange. At two thousand visitors a second, nginx alone needs almost both cores.'},
{ch:'E04 · a viral link', name:'Options', kind:'options', steps:2, ev:'E04', head:'More handshakes per second: three ways', sec:30,
 rows:[['A CDN','Another company’s servers do the handshakes, close to visitors.','no'],['A load balancer','A separate machine does the handshakes: + €7.49 a month.','no'],['Twice the cores: CX33','Same software, four cores instead of two: + €3 a month. The smallest change.','yes']],
 say:'So we need more handshakes per second. Three ways to get them: a CDN, where another company’s servers do the handshakes close to visitors; a load balancer, a separate machine that does them for us; or simply more cores. The smallest change is more cores: the same software on four cores instead of two, for three euros a month more.'},
{ch:'E04 · a viral link', name:'v3 replay: passes', kind:'replay', run:'e04-02', result:[['redirect p99','14.6 ms','limit 100 ms',1],['errors','0%','limit 0.1%',1]], creates:2, stage:3, from:15, to:785, at:300, dur:16, res:'cpu', split:['nginx','node'], ev:'E04', head:'v3: same software, 4 cores', hi:['machine'], oldSpec:'CX23 · 2 vCPU', ghost:'e04-01', ghostLabel:'v2', ghostAt:9000, verdict:'pass', sec:30, screen:['15 ms','CPU 76%','+ €3/mo'], src:'e04-02 to e04-04',
 say:'Same software, four cores. Fifteen milliseconds, with the CPU at about three quarters. Passed, three runs out of three.'},

// ===== E05
{ch:'E05 · click counts', name:'E05 card', kind:'card', ev:'E05', type:'Requirement', title:'Click counts', what:'Creators see clicks per link per day, at most a minute behind. Tested by rerunning the viral spike with counting on.', why:'Knowing who clicked is why many people use a shortener at all. And counting must not slow the redirect down.', pass:'every link’s count within 1% of the truth, at most 60 s behind', sec:20,
 say:'Event five: creators want to see how many clicks each link gets. Within one percent, at most a minute behind, measured during the same viral spike.'},
{ch:'E05 · click counts', name:'The obvious way: save every click', kind:'replay', run:'e05-01', result:[['redirect p99','10 s','limit 100 ms',0],['errors','91%','limit 0.1%',0],['click counts','231 links off','by more than 1% · counted 125,550, real 118,913',0]], creates:2, stage:4, from:15, to:785, at:300, dur:16, res:'cpu', answered:true, errWord:'failed', ev:'E05', head:'The obvious way: save every click', nodeSub:['save each click, then answer'], verdict:'fail', sec:40, screen:['≈ 170/s answered','CPU 28%'], src:'e05-01',
 say:'The obvious way: save every click to the database before redirecting. It collapses at about 170 clicks a second. And the CPU is idle. The one thread is just waiting for the disk, again and again, two thousand times a second. And the counts are wrong too: too high. Visitors gave up after ten seconds, but the server still got to their clicks later and counted them.'},
{ch:'E05 · click counts', name:'v4: count in memory', kind:'replay', run:'e05-03', result:[['redirect p99','15.4 ms','limit 100 ms',1],['click counts','exact','1,101 links checked',1]], creates:2, stage:4, from:15, to:785, at:300, dur:16, res:'cpu', ev:'E05', head:'v4: count in memory, save every second', hi:['nodeSub'], nodeSub:['tally in memory, save every 1 s'], ghost:'e05-01', ghostLabel:'the obvious way', ghostAt:9000, verdict:'pass', sec:40, screen:['15 ms','counts exact'], src:'e05-03 to e05-05',
 say:'So count in memory, and save once a second, all in one go. One wait for the disk per second instead of two thousand. Fifteen milliseconds, and every count exact. The price: if the power dies, we could lose about a second of counts. We’ll find out soon.'},
{ch:'E05 · click counts', name:'The tables at v4', kind:'tables', ev:'E05', head:'v4: counts, and browsers must ask every time', sec:30,
 tables:[{name:'links', cols:['id','url','created_at'], rows:[['10000000','https://news.example.invalid/…/story-10000000','1791123320']]},{name:'names', cols:['name','url','created_at'], rows:[]},{name:'clicks', isNew:true, cols:['code','day','count'], rows:[['FXsk','2026-10-04','1284'],['launch-day','2026-10-04','310']]}],
 side:['every redirect now looks like:','HTTP/1.1 301 Moved Permanently','Location: https://example.com/…','Cache-Control: no-store'], sideNew:true, sideX:1010, sideY:300,
 caption:'one row per link per day, added to once a second · indexed on (code, day), its primary key · example rows',
 say:'A third table: one row per link per day, topped up once a second. Code and day together are its key, so there’s an index on them: saving a count and reading a link’s stats both go straight to the right rows. And one more detail. A 301 means “moved permanently”, so a browser is allowed to remember it and never ask us again, and those clicks would never be counted. So every redirect now carries one line: don’t remember this.'},

// ===== E06
{ch:'E06 · power cut', name:'E06 card', kind:'card', ev:'E06', type:'Failure', title:'Power cut', what:'Under E02 traffic, the machine is switched off without warning, then on again.', why:'Servers crash and lose power. Whatever we told a creator was saved must still be there afterwards.', pass:'no confirmed link lost · redirects back within 5 minutes', sec:20,
 say:'Event six: we pull the plug. Under normal traffic, the machine is switched off without warning, then back on. No confirmed link may be lost, and redirects must be back within five minutes.'},
{ch:'E06 · power cut', name:'E06 replay on v4', kind:'replay', run:'e06-01', result:[['back after','61 s','limit 5 min',1],['confirmed links lost','1 · FXwR','limit 0',0]], creates:2, stage:4, from:60, to:330, at:330, dur:10, metric:'answered', ev:'E06', head:'Power cut, v4', down:[143,204,'powered off'], errWord:'no answer', marks:[{t:143,label:'power off',red:1},{t:204,label:'back after 61 s'}], verdict:'fail', sec:40, screen:['61 s','FXwR'], src:'e06-01',
 say:'Redirects are back in sixty-one seconds. That passes. But one link, confirmed a second before the cut, is gone, and its code was handed to someone else. A creator was told “your link is F-X-w-R”, and it now opens a stranger’s page.'},
{ch:'E06 · power cut', name:'Why: the undone save', kind:'sqlite', steps:3, sec:60, src:'e06-01; SQLite docs',
 say:'Here’s how SQLite saves with its default settings. First it copies the part of the file it’s about to change into a separate journal file: an undo copy. Then it writes the new link into the database. Then it deletes the journal, and that deletion is the moment the save counts as final. Then we tell the creator: saved. ▶ The catch: deleting a file is first noted only in memory; the disk catches up a few seconds later. If the power dies in those seconds, the journal is still on disk after the reboot. SQLite sees an undo copy, decides the save never finished, and puts the old version back. The link is gone. ▶ And because our codes count up, the next new link gets the same number, the same code, and now it opens a stranger’s page. The fix is one setting, synchronous equals EXTRA: SQLite waits until the deletion is really on disk before we say saved.'},
{ch:'E06 · power cut', name:'v5 replay: passes', kind:'replay', run:'e06-02', result:[['back after','67 s','limit 5 min',1],['confirmed links lost','0 of 827','limit 0',1],['click counts','7 links short','each 1 click short, all under 100 clicks, where 1% rounds down to 0 · accepted','a']], creates:2, stage:5, from:60, to:330, at:330, dur:10, metric:'answered', ev:'E06', head:'v5: one setting', hi:['nodeSub'], nodeSub:['synchronous = EXTRA'], down:[142,209,'powered off'], errWord:'no answer', marks:[{t:142,label:'power off',red:1},{t:209,label:'back after 67 s'}], verdict:'pass', sec:40, screen:['67 s','0 of 827 lost'], src:'e06-02 (e06-03 and e06-04 the same)',
 say:'Version five: one setting. Pull the plug again. Back in about a minute, and not one confirmed link lost, including the ten or so confirmed in the last five seconds before the cut. Three power cuts, the same every time. The one thing that is lost: about the last second of click counts. Seven small links came out one click short. For a link with under a hundred clicks, one percent rounds down to zero, so even one click fails the rule. We accept that, out loud: keeping it would mean every single click waiting for the disk, the thing that collapsed at 170 a second.'},
{ch:'E06 · power cut', name:'Rerun grid', kind:'grid', upto:5, sec:5, say:'Everything before still passes.'},

// ===== E07
{ch:'E07 · machine lost', name:'E07 card', kind:'card', ev:'E07', type:'Failure', title:'The machine is lost', what:'Under E02 traffic, the server and its disk are deleted for good.', why:'Cloud machines and disks do get lost for good. How fast can we be back, and what do we lose?', pass:'back on a new machine within 1 hour · lose at most the last 5 minutes of links', sec:20,
 say:'Event seven: the machine is gone. Server and disk, deleted for good. We get an hour to be back, and may lose at most the last five minutes of new links.'},
{ch:'E07 · machine lost', name:'What v5 is missing, and what v6 adds', kind:'gaps', steps:2, stage:5, ev:'E07', head:'v5 can’t survive this', sec:70,
 rows:[['copy','the only copy of the data is on this disk','Litestream copies every change to a Volume'],['address','links contain this server’s IP, deleted with it','keep the IP address when the server goes'],['notice','nobody outside is watching','Better Stack checks /health every 30 s'],['rebuild','a new server would be set up by hand','one script: new server, same IP, restore'],['codes','after a restore, the newest codes could repeat','confirm a new link only once it’s in the copy']],
 say:'This one didn’t need a test. Version five is missing five things. A copy: the only copy of the data is on the disk we’re about to delete. An address: we never bought a domain, so every short link points straight at this server’s IP address, and that address is deleted with the server. A way to notice: nobody outside is watching. A way to rebuild: a new server would have to be set up by hand. And codes: any copy is a moment behind, and our codes count up, so after a restore the newest codes could be handed out again. We know that trap from the power cut. ▶ Version six answers each one. Litestream copies every change to a Volume, a disk that outlives the server. We keep the IP address. Better Stack checks a health page every thirty seconds and emails us. One script builds a new server on the same IP and restores the copy. And a new link is confirmed only once it’s in the copy, which costs a create about forty milliseconds. We actually learned that last one the hard way: our first version copied in the background, and a link confirmed in its last second came back with its code reissued.'},
{ch:'E07 · machine lost', name:'Options', kind:'options', steps:2, ev:'E07', head:'Copy: three ways', sec:50,
 rows:[['Hetzner’s daily backups','A copy once a day, but we may lose at most 5 minutes. And backups belong to the server: deleting the server deletes them too.','no'],['A standby server','A second server, always running with a live copy, takes over in seconds. But we only have to be back within an hour, and it would double the bill every month.','no'],['Litestream, copying every change to a Volume','About a second behind. A Volume is a separate disk that survives the server being deleted: €0.57 a month.','yes']],
 say:'First, the copy. Hetzner’s daily backups are a copy once a day, and we may lose at most five minutes. Worse, the backups belong to the server: delete the server and they go with it. A standby server, a second machine always running with a live copy, would take over in seconds, but we only have to be back within an hour, and it would double the bill every month. Litestream streams every change, about a second behind, to a Volume: a separate disk that survives the server being deleted, for fifty-seven cents a month.'},
{ch:'E07 · machine lost', name:'E07 replay on v6', kind:'replay', run:'e07-02', result:[['back after','204 s','limit 1 h',1],['confirmed links lost','0','may lose the last 5 min',1]], creates:2, stage:6, from:300, to:720, at:720, dur:13, metric:'answered', ev:'E07', head:'Machine lost, v6', down:[415,619,'deleted'], after:[619,'new machine · same IP · restored from the Volume'], errWord:'no answer', marks:[{t:415,label:'deleted',red:1},{t:493,label:'alert after 78 s',y:46},{t:619,label:'back after 204 s',y:74}], verdict:'pass', sec:40, screen:['204 s','0 lost'], src:'e07-02, e07-03, e07-05',
 say:'Delete. An outside monitor notices after seventy-eight seconds. One script builds a new machine on the same IP and restores from the Volume. Links are back in under three and a half minutes, and not one confirmed link is lost.'},
{ch:'E07 · machine lost', name:'Rerun grid', kind:'grid', upto:6, sec:5, say:'Everything before still passes.'},
{ch:'E07 · machine lost', name:'Scoreboard so far', kind:'score', upto:6, sec:15, src:'scoreboard.md',
 say:'Seven versions in. €9.56 a month, and it now survives losing the machine.'},

// ===== E08
{ch:'E08 · 10% of Bitly', name:'E08 card', kind:'card', ev:'E08', type:'Load', title:'10% of Bitly', what:'1,000 clicks a second and 20 new links a second, with 100 million links stored: 12 GB, more than the server’s memory.', why:'Production scale: about 877 million clicks a month. And for the first time, the data no longer fits in memory.', pass:'', sec:20,
 say:'Event eight: ten percent of Bitly. A thousand clicks a second, twenty new links a second, and a hundred million links stored. That’s twelve gigabytes, more than the server’s memory. No cache. Will it hold?'},
{ch:'E08 · 10% of Bitly', name:'How Litestream keeps a copy', kind:'litestream', part:1, sec:50,
 say:'Before we run it, a look at Litestream, because this event’s problem comes from it. SQLite writes every change to a change log, the WAL, and about once a second Litestream copies the new part of that log to the Volume. The copy on the Volume is one full copy of the database, plus a small change file for every second since. To restore, you take the full copy and replay the small changes on top. A fresh full copy is made whenever Litestream starts on a new database, like after we load a hundred million links or after a restore, and once a day. Ours is 1.7 gigabytes: the 12 gigabyte database, compressed. And since version six, every new link waits for its own small change file before we say saved.'},
{ch:'E08 · 10% of Bitly', name:'E08 replay: slow creates', kind:'replay', run:'e08-02', result:[['create p99','848 ms','limit 300 ms',0],['redirect p99','17.2 ms','limit 100 ms',1]], creates:20, stage:6, from:15, to:355, at:200, dur:11, metric:'create', limit:300, res:'cpu', split:['lite','nginx','node'], ev:'E08', head:'10% of Bitly, v6', verdict:'fail', sec:45, screen:['848 ms','17 ms','Litestream ≈ 1.5 cores'], src:'e08-02 (e08-01 failed the same way)',
 say:'Clicks are fine: eighteen milliseconds, with a database bigger than memory and no cache. But creating a link sometimes takes most of a second. Every create waits for its own copy, and Litestream is busy rewriting its whole 1.7 gigabyte copy. You can see it: Litestream jumps to one and a half cores at exactly those moments.'},
{ch:'E08 · 10% of Bitly', name:'Why Litestream tidies its copy', kind:'litestream', part:2, sec:45, screen:['1.7 GB','1–1.5 s'], src:'e08-01, e08-02; stages/07 log',
 say:'Why do creates queue? One small file a second is 3,600 an hour, and restoring would mean replaying every one of them. So Litestream tidies its copy: it merges small files into bigger ones, every few minutes and then every hour. A merge reads a group of files and writes them out as one new file. Normally that’s a few seconds of small changes. But right after a fresh full copy, the full copy itself is in the group, so the merge reads and rewrites all 1.7 gigabytes. While that runs, each new link’s small file waits in line behind it: a second or more.'},
{ch:'E08 · 10% of Bitly', name:'Options', kind:'options', steps:2, ev:'E08', head:'Slow creates: what to change', sec:45,
 rows:[['A bigger server','The CPU and disk weren’t full. The copies queue one at a time.','no'],['Tune Litestream to rewrite less often','Can’t remove the rewrite after a fresh copy or the daily one.','no'],['Confirm links on local disk; jump the counter after a restore','A link confirmed in the machine’s last second can be lost (404), but its code is never reused. Names still wait for the copy.','yes']],
 say:'A bigger server wouldn’t help: nothing was full, the copies just queue. Tuning Litestream can’t remove the big rewrites. So: confirm links on the local disk again, and after any restore, jump the counter a million numbers ahead. A link confirmed in the machine’s last second can now be lost, which event seven allows, but its code can never be handed out again.'},
{ch:'E08 · 10% of Bitly', name:'The counter jump', kind:'jump', steps:3, sec:60, screen:['+1,000,000'], src:'e07-06; stages/07 log',
 say:'Here’s the counter jump. Our codes are just numbers counting up. After a machine is lost, we restore the copy, and the newest link in it is, say, number 10,000,819. A link or two confirmed in the old machine’s very last second never made it into the copy. Those are lost, and they answer not found, which event seven allows. ▶ But their numbers were handed out, so before the app starts, we put a placeholder a million numbers ahead. The next new link is 11,000,820, and the codes of the lost links can never come round again. Why a million? At this event’s twenty new links a second, a million numbers covers about fourteen hours, and the copy is only ever about a second behind. ▶ Names can’t jump. A name like launch-day isn’t a number: if a confirmed name were lost, someone else could register it after the restore. So names still wait for the copy. That’s fine because names are a small share of creates: in this event, all twenty a second were generated links.'},
{ch:'E08 · 10% of Bitly', name:'v7 replay: passes', kind:'replay', footnote:'v7 also saves a one-row heartbeat every second: it avoids a rare 30-second freeze right after a fresh full copy · details in the description', run:'e08-07', result:[['create p99','39.6 ms','limit 300 ms',1],['redirect p99','18.7 ms','limit 100 ms',1]], creates:20, stage:7, from:15, to:355, at:340, dur:10, metric:'create', limit:300, res:'cpu', ev:'E08', head:'v7: counter jump and heartbeat', hi:['nodeSub'], nodeSub:['jump after restore · heartbeat 1 s'], ghost:'e08-02', ghostLabel:'v6', ghostAt:3000, verdict:'pass', sec:30, screen:['22 ms','CPU ≈ 50%'], src:'e08-07 to e08-09',
 say:'Creates: forty milliseconds, well under three hundred. Clicks: nineteen. A thousand clicks a second, a hundred million links, CPU about half used. One small extra in this version: a tiny heartbeat save every second, which avoids a rare thirty-second freeze right after a fresh full copy. The full story is in the description.'},
{ch:'E08 · 10% of Bitly', name:'Rerun grid', kind:'grid', upto:7, sec:5, say:'Everything before still passes.'},

// ===== Ending
{ch:'E09 · takedowns', name:'E09 card', kind:'card', ev:'E09', type:'Requirement', title:'Takedowns', what:'Under E08 traffic, 100 links are reported and taken down during the run.', why:'You can’t see where a short link goes until you click it, which makes them popular for scams. When one is reported, an operator must be able to switch it off fast.', pass:'no taken-down link redirects more than 60 s after its takedown', sec:20,
 say:'Last event: takedowns. A link turns out to be a scam. Under full traffic, a hundred links are taken down, and none may redirect for more than sixty seconds afterwards.'},
{ch:'E09 · takedowns', name:'v7 can’t take a link down', kind:'board', stage:7, ev:'E09', head:'v7: no way to take a link down', hi:[], notes:['There is no takedown at all: every reported link keeps redirecting.','· run e09-01: 0 of 101 takedowns confirmed'], sec:20, src:'e09-01',
 say:'Run the event against version seven: zero of a hundred and one takedowns confirmed. There’s simply no way to take a link down, so every reported link keeps working. The only option would be editing the database by hand.'},
{ch:'E09 · takedowns', name:'The tables at v8', kind:'tables', ev:'E09', head:'v8: how a takedown works', sec:40,
 tables:[{name:'links', cols:['id','url','created_at','taken_down_at'], newCols:['taken_down_at'], rows:[['10000000','https://news.example.invalid/…','1791123320','1791552014'],['10000001','https://news.example.invalid/…','1791123320','']]},{name:'names', cols:['name','url','created_at','taken_down_at'], newCols:['taken_down_at'], rows:[['launch-day','https://example.com/launch','1791126920',''],['free-prize','https://scam.example/…','1791127000','1791552100']]}],
 side:['the operator sends:','POST /links/FXsk/takedown','Authorization: Bearer <secret>','→ 200, once it’s in the copy','next click on FXsk → 410 Gone'], sideX:1010, sideY:250,
 caption:'one new column on both tables: empty = live, a time = taken down · a taken-down name stays registered, so nobody can claim it again · example rows',
 say:'Here’s how a takedown works in version eight. An operator sends one request with a secret key. The server marks the link with the time it was taken down: one new column, on both tables, so custom names can be taken down too. It waits until that mark is in the copy, so a machine loss can’t bring the link back, and only then says done. From the very next click, the link answers 410 Gone: it was here, and it was removed on purpose. And a taken-down name stays registered, so nobody can claim it again.'},
{ch:'E09 · takedowns', name:'v8: passes on the next click', kind:'replay', run:'e09-02', result:[['takedowns','100 of 100','',1],['redirects after a takedown','0','limit: none after 60 s',1]], creates:20, stage:8, from:15, to:355, at:340, dur:10, res:'cpu', ev:'E09', head:'v8: takedowns', hi:['nodeSub'], nodeSub:['POST /takedown → 410 Gone'], verdict:'pass', sec:35, screen:['300 takedowns','0 redirects after'], src:'e09-02 to e09-04',
 say:'Usually the hard part is the cache: every copy of the link has to be told. We don’t have one. Every click reads the database, and redirects tell browsers not to remember them. So a takedown works from the very next click. Three hundred takedowns, zero redirects afterwards.'},
{ch:'E09 · takedowns', name:'Always true: takedowns join', kind:'rules', added:['E03','E05','E09'], sec:10,
 say:'And the last always-true rule: a link we take down stays down.'},
{ch:'E09 · takedowns', name:'Rerun grid', kind:'grid', upto:8, foot:'E07 on v8 also ran on some slow Hetzner hosts (p99 100–118 ms): accepted', sec:10, src:'e07-07 to e07-09',
 say:'And on the final version, every earlier event still passes.'},
{ch:'The ending', name:'Scoreboard', kind:'score', upto:8, sec:30, src:'scoreboard.md',
 say:'Nine versions. Every row was forced by an event, and every number came from a run.'},
{ch:'The ending', name:'The final claim', kind:'claim', steps:3, sec:40, screen:['877 million a month','14.8 ms','€9.56/mo'], src:'E08, E09, scoreboard.md',
 say:'So here’s the claim. A thousand clicks a second at peak works out to about 877 million clicks a month, roughly ten percent of Bitly, and seventeen and a half million new links. With a hundred million links stored, more than the server’s memory: redirects in under fifteen milliseconds and new links in twenty-six, for ninety-nine out of a hundred, and no errors. For €9.56 a month.'},
{ch:'The ending', name:'Caveats', kind:'caveats', sec:60, src:'stages/06 and 07 logs; event-script.md',
 items:[['One event at a time, and failures at a smaller scale','Combinations, like a viral spike during a power cut, were never tested. The power cut and the machine loss ran at 1% traffic with 10 million links; at 100 million, restoring alone takes about 3 minutes.'],['Measured next door','The load generator sat in the same data centre, so the times don’t include visitors’ own internet connection.'],['One machine, one data centre','The copy lives in the same location, so losing the whole data centre isn’t covered.'],['No domain','Links used the server’s IP address and a self-made certificate. A real service needs a domain and a proper certificate.']],
 say:'A few honest caveats before we finish. We tested one event at a time, so combinations, like a viral spike during a power cut, were never tested. And the power cut and machine loss ran at one percent traffic with ten million links; at a hundred million, restoring alone takes about three minutes. Every time was measured from a machine in the same data centre, so your own internet connection isn’t included. It’s one machine in one data centre: losing the whole data centre isn’t covered. And we never bought a domain, so the links used the server’s IP address and a self-made certificate. A real service needs a proper domain and certificate.'},
];

// ---------- rendering a beat (static or live)
function renderBeat(c,b,st,t,sim,el){ c.fillStyle=BOARD; c.fillRect(0,0,W,H);
  if(b.kind==='replay') drawReplay(c,b,t,sim); else (K[b.kind]||(()=>{}))(c,b,st,el); }
function fitCanvas(cv,maxD){ const d=Math.min(window.devicePixelRatio||1,maxD), w=Math.round(cv.clientWidth*d), h=Math.round(w*9/16); if(w>0 && (cv.width!==w||cv.height!==h)){ cv.width=w; cv.height=h; } return cv.width/W; }

// ---------- Read view
const readEl=document.getElementById('read'), thumbs=[];
const total=EP.reduce((a,b)=>a+(b.sec||0),0);
document.getElementById('facts').innerHTML=`<span><b>${EP.length}</b> beats</span><span>about <b>${Math.round(total/60)} min</b></span><span>events <b>E01–E09</b></span><span>stages <b>0–8</b></span><span>numbers from <b>episodes/url-shortener/results</b></span>`;
let chap=null, sec=null, n=0;
EP.forEach((b,i)=>{ if(b.ch!==chap){ chap=b.ch; sec=document.createElement('section'); sec.className='chapter'; const chT=EP.filter(x=>x.ch===chap).reduce((a,x)=>a+(x.sec||0),0); sec.innerHTML=`<h2>${chap}<span>${Math.round(chT/6)/10} min</span></h2>`; readEl.appendChild(sec); }
  n++; const d=document.createElement('article'); d.className='beat'; d.id='beat-'+(i+1);
  d.innerHTML=`<button class="thumb" type="button" aria-label="Present from beat ${i+1}"><canvas></canvas></button><div class="body"><div class="head"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${b.name}</h3><span class="dur">~${b.sec||0} s</span></div><p class="say">${b.say}</p><div class="meta">${b.screen&&b.screen.length? `<span>on screen: <b>${b.screen.join(' · ')}</b></span>`:'<span>on screen: no numbers</span>'}${b.src?`<span>source: ${b.src}</span>`:''}</div>${b.note?`<p class="note">${b.note}</p>`:''}</div>`;
  d.querySelector('.thumb').onclick=()=>{ show('present'); go(i,0); };
  sec.appendChild(d); thumbs.push({cv:d.querySelector('canvas'), b});
});
const steps=b=> b.kind==='replay'? 2 : (b.steps||1);
let STATIC=false;
function drawThumbs(){ STATIC=true; thumbs.forEach(({cv,b})=>{ const k=fitCanvas(cv,1.5); if(!cv.width) return; const c=cv.getContext('2d'); c.setTransform(k,0,0,k,0,0);
  let sim=null, t=0; if(b.kind==='replay'){ t=b.at??b.to; sim=new Sim(b); sim.warm({...sample(b.run,t)}); }
  renderBeat(c,b,steps(b)-1,t,sim,null); }); STATIC=false; }

// ---------- Present view
const live=document.getElementById('live'), lc=live.getContext('2d');
let bi=0, si=0, pt=0, playing=false, sim=new Sim(), enterAt=0, notesOn=true;
const notesEl=document.getElementById('notes'), posEl=document.getElementById('pos');
const jumpEl=document.getElementById('jump');
jumpEl.innerHTML=EP.map((b,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${b.ch} · ${b.name}</option>`).join('');
jumpEl.onchange=()=>{ go(+jumpEl.value,0); jumpEl.blur(); };
function go(i,s){ bi=clamp(i,0,EP.length-1); si=s; const b=EP[bi]; enterAt=performance.now();
  if(b.kind==='replay'){ pt=b.from; sim=new Sim(b); sim.warm(sample(b.run,pt)); playing=s>=1; }
  posEl.textContent=`${bi+1} / ${EP.length}`; jumpEl.value=String(bi); notesEl.innerHTML=`<p class="say">${b.say}</p><div class="meta">${b.name}${b.screen&&b.screen.length? ' · on screen: '+b.screen.join(' · '):''}</div>`; notesEl.hidden=!notesOn; }
function next(){ const b=EP[bi]; if(si<steps(b)-1){ si++; enterAt=performance.now(); if(b.kind==='replay'&&si===1) playing=true; } else if(bi<EP.length-1) go(bi+1,0); }
function prev(){ const b=EP[bi]; if(si>0){ if(b.kind==='replay') go(bi,0); else si--; } else if(bi>0){ go(bi-1,steps(EP[bi-1])-1); } }
function togglePlay(){ const b=EP[bi]; if(b.kind!=='replay') return; if(pt>=b.to){ go(bi,1); return; } playing=!playing; if(playing){ si=1; enterAt=performance.now()-1000; } }
function replay(){ go(bi,0); }
document.getElementById('next').onclick=next; document.getElementById('prev').onclick=prev; document.getElementById('replay').onclick=replay; const ppBtn=document.getElementById('pp'); ppBtn.onclick=togglePlay;
// ---------- laser pointer: drag to draw a trail that fades after LASER_LIFE seconds
// Its blue sits outside the notation on purpose: it is your hand, not part of the board.
const LASER='#2563eb', LASER_LIFE=1.4; let laserOn=false, drawing=false, trail=[], strokeId=0;
const laserBtn=document.getElementById('laser');
function setLaser(v){ laserOn=v; drawing=false; laserBtn.setAttribute('aria-pressed',v); laserBtn.textContent=v?'Laser on':'Laser off'; live.classList.toggle('laser',v); }
laserBtn.onclick=()=>setLaser(!laserOn);
const toBoard=e=>{ const r=live.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; };
live.addEventListener('pointerdown',e=>{ if(!laserOn){ next(); return; } drawing=true; strokeId++; try{ live.setPointerCapture(e.pointerId); }catch(_){} trail.push({...toBoard(e),t:performance.now(),id:strokeId}); });
live.addEventListener('pointermove',e=>{ if(laserOn&&drawing) trail.push({...toBoard(e),t:performance.now(),id:strokeId}); });
['pointerup','pointercancel'].forEach(ev=>live.addEventListener(ev,()=>{ drawing=false; }));
function drawLaser(c){ const now=performance.now(); trail=trail.filter(p=>now-p.t<LASER_LIFE*1000); if(!trail.length) return;
  c.lineCap='round'; c.lineJoin='round';
  for(let i=1;i<trail.length;i++){ const a=trail[i-1], b=trail[i]; if(a.id!==b.id) continue; const f=1-(now-b.t)/(LASER_LIFE*1000);
    c.globalAlpha=clamp(f,0,1); c.strokeStyle=LASER; c.lineWidth=2+6*f; L(c,a.x,a.y,b.x,b.y); }
  const p=trail[trail.length-1]; if(drawing){ c.globalAlpha=1; c.fillStyle=LASER; c.beginPath(); c.arc(p.x,p.y,7,0,Math.PI*2); c.fill(); }
  c.globalAlpha=1; c.lineCap='butt'; }
const screenEl=document.getElementById('screen');
document.getElementById('full').onclick=()=>{ try{ (screenEl.requestFullscreen? screenEl.requestFullscreen(): Promise.reject()).catch(()=>{}); }catch(e){} };
document.addEventListener('keydown',e=>{ if(document.getElementById('present').hidden || e.target===jumpEl) return; if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); } else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); } else if(e.key==='r'||e.key==='R') replay(); else if(e.key==='p'||e.key==='P') togglePlay(); else if(e.key==='n'||e.key==='N'){ notesOn=!notesOn; notesEl.hidden=!notesOn; } else if(e.key==='f'||e.key==='F') document.getElementById('full').click(); else if(e.key==='l'||e.key==='L') setLaser(!laserOn); else if(e.key==='Escape'&&laserOn) setLaser(false); });

let last=performance.now();
function tick(ts){ const dt=Math.min(.05,(ts-last)/1000); last=ts;
  if(!document.getElementById('present').hidden){ const b=EP[bi], k=fitCanvas(live,2); lc.setTransform(k,0,0,k,0,0);
    if(b.kind==='replay'){ const sp=(b.to-b.from)/(b.dur||12); if(playing && performance.now()-enterAt>500){ pt=Math.min(b.to,pt+dt*sp); if(pt>=b.to) playing=false; } if(playing) sim.step(dt,sample(b.run,pt),true); }
    ppBtn.disabled=b.kind!=='replay'; ppBtn.textContent= b.kind==='replay' && playing ? 'Pause' : 'Play';
    renderBeat(lc,b,si,pt,sim,(performance.now()-enterAt)/1000); drawLaser(lc); }
  requestAnimationFrame(tick); }

// ---------- tabs
function show(v){ const p=v==='present'; document.getElementById('read').hidden=p; document.getElementById('present').hidden=!p; document.getElementById('tab-read').setAttribute('aria-selected',!p); document.getElementById('tab-present').setAttribute('aria-selected',p); if(p) window.scrollTo(0,0); }
document.getElementById('tab-read').onclick=()=>show('read'); document.getElementById('tab-present').onclick=()=>{ show('present'); go(bi,si); };
go(0,0); drawThumbs(); if(document.fonts) document.fonts.ready.then(drawThumbs);
let rT=0; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(drawThumbs,150); });
requestAnimationFrame(tick);
</script>
