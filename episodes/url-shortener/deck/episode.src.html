<title>URL Shortener Episode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: two views of one episode. Read = a running order you review top to bottom (board thumbnail + what you say). Present = one full-width board you click through on camera. Single light theme on purpose: the notation is ink on a white board. */
:root{
  --page:#f4f4f2; --board:#ffffff; --ink:#111111; --grey:#9a9a9a; --soft:#5c5c5c; --line:#e0e0dc; --red:#d1291f;
  --text:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
body{ background:var(--page); color:var(--ink); font:16px/1.6 var(--text); }
.wrap{ max-width:1180px; margin:0 auto; padding-inline:24px; padding-block:32px 72px; display:grid; gap:28px; }
header{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px 24px; flex-wrap:wrap; }
header .t{ display:grid; gap:6px; min-width:0; }
h1{ font:500 clamp(26px,3.2vw,36px)/1.15 var(--text); margin:0; letter-spacing:-.01em; }
header p{ margin:0; color:var(--soft); max-width:64ch; }
.mono{ font-family:var(--mono); }
.tabs{ display:inline-flex; border:1px solid var(--ink); border-radius:6px; overflow:hidden; }
.tabs button{ font:500 14px var(--text); background:var(--board); color:var(--ink); border:0; padding:8px 18px; cursor:pointer; }
.tabs button[aria-selected="true"]{ background:var(--ink); color:var(--board); }
button:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
.facts{ display:flex; flex-wrap:wrap; gap:8px 28px; font:400 14px var(--mono); color:var(--soft); }
.facts b{ color:var(--ink); font-weight:500; }

/* Read view */
.chapter{ display:grid; gap:14px; }
.chapter h2{ font:500 22px/1.25 var(--text); margin:12px 0 0; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
.chapter h2 span{ font:400 13px var(--mono); color:var(--grey); }
.beat{ display:grid; grid-template-columns:minmax(0,44%) minmax(0,1fr); gap:22px; background:var(--board); border:1px solid var(--line); padding:14px; }
.beat .thumb{ all:unset; cursor:pointer; display:block; min-width:0; }
.beat .thumb canvas{ display:block; width:100%; aspect-ratio:16/9; border:1px solid var(--line); }
.beat .thumb:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
.beat .body{ display:grid; gap:10px; align-content:start; min-width:0; }
.beat .head{ display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
.beat .n{ font:400 13px var(--mono); color:var(--grey); }
.beat h3{ font:500 18px/1.3 var(--text); margin:0; }
.beat .dur{ font:400 13px var(--mono); color:var(--grey); margin-left:auto; }
.beat .say{ margin:0; font-size:16px; line-height:1.6; border-left:2px solid var(--ink); padding-left:14px; }
.beat .meta{ display:flex; flex-wrap:wrap; gap:6px 18px; font:400 13px var(--mono); color:var(--soft); }
.beat .meta b{ font-weight:500; color:var(--ink); }
.beat .note{ margin:0; font-size:14px; color:var(--soft); }

/* Present view */
.stage{ display:grid; gap:12px; }
.screen{ background:var(--board); border:1px solid var(--line); }
.screen canvas{ display:block; width:100%; aspect-ratio:16/9; max-width:100%; cursor:pointer; }
.screen:fullscreen{ display:flex; align-items:center; justify-content:center; background:#fff; border:0; }
.screen:fullscreen canvas{ width:auto; height:100%; max-width:100%; max-height:100%; }
.bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; font-size:14px; }
.btn[aria-pressed="true"]{ background:var(--ink); color:var(--board); }
.screen canvas.laser{ cursor:crosshair; touch-action:none; }
.btn{ font:500 14px var(--text); background:var(--board); color:var(--ink); border:1px solid var(--ink); border-radius:6px; padding:6px 14px; cursor:pointer; }
.jump{ font:400 14px var(--text); color:var(--ink); background:var(--board); border:1px solid var(--ink); border-radius:6px; padding:6px 8px; max-width:min(100%,420px); }
.jump:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
.pos{ font:400 13px var(--mono); color:var(--soft); font-variant-numeric:tabular-nums; }
.keys{ margin-left:auto; font:400 12px var(--mono); color:var(--grey); }
.notes{ background:var(--board); border:1px solid var(--line); padding:16px 18px; display:grid; gap:8px; }
.notes .say{ margin:0; font-size:18px; line-height:1.6; }
.notes .meta{ font:400 13px var(--mono); color:var(--soft); }
@media (max-width:820px){ .beat{ grid-template-columns:1fr; } .keys{ margin-left:0; } }
@media (max-width:440px){ .wrap{ padding-inline:16px; } }
</style>

<div class="wrap">
  <header>
    <div class="t">
      <h1>URL shortener · the episode</h1>
      <p>Every beat of the video in order: what’s on the board, what you say, and which run each number comes from. Read it top to bottom, then switch to Present to click through it out loud.</p>
    </div>
    <div class="tabs" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tab-read" aria-selected="true">Read</button>
      <button type="button" role="tab" id="tab-present" aria-selected="false">Present</button>
    </div>
  </header>
  <div class="facts" id="facts"></div>

  <main id="read"></main>

  <section id="present" class="stage" hidden>
    <div class="screen" id="screen"><canvas id="live" aria-label="Current board"></canvas></div>
    <div class="bar">
      <button class="btn" id="prev" type="button">← Back</button>
      <button class="btn" id="next" type="button">Next →</button>
      <button class="btn" id="pp" type="button">Play</button>
      <button class="btn" id="replay" type="button">Replay</button>
      <button class="btn" id="full" type="button">Full screen</button>
      <button class="btn" id="laser" type="button" aria-pressed="false">Laser off</button>
      <select class="jump" id="jump" aria-label="Go to slide"></select>
      <span class="pos" id="pos"></span>
      <span class="keys">→ / space next · ← back · P play/pause · R replay · N notes · F full screen · L laser</span>
    </div>
    <div class="notes" id="notes"></div>
  </section>
</div>

<script>
const RUNS=__RUNS__;
// RUNS[id] = per 10 s window: [req/s attempted, redirect p99 ms, create p99 ms, error %, CPU avg %, iowait %, Node CPU %, nginx CPU %, Litestream CPU %, creates/s (201 + 409 responses)] (program CPU in % of one core)

const W=1600, H=900, WIN=10;
const INK='#111111', GREY='#9a9a9a', RED='#d1291f', BOARD='#ffffff', FAINT='#e8e8e5';
const SANS='"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif', MONO='"IBM Plex Mono", ui-monospace, Menlo, monospace';
const ft=(s,w=400)=>`${w} ${s}px ${SANS}`, fm=(s,w=400)=>`${w} ${s}px ${MONO}`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,f)=>a+(b-a)*f;
const LMIN=Math.log10(5), LMAX=Math.log10(20000), lf=p=>clamp((Math.log10(Math.max(p,1))-LMIN)/(LMAX-LMIN),0,1);
const fmtInt=v=>Math.round(v).toLocaleString('en-US');
const ms=v=> v<1000? (v<100? v.toFixed(1): Math.round(v))+' ms' : (v/1000).toFixed(1)+' s';

// ---------- run sampling
function series(id,k){ const R=RUNS[id]; return R.map(w=> k==='answered' ? (w[0]||0)*(1-(w[3]||0)/100) : (w[{rps:0,redirect:1,create:2,err:3,cpu:4,io:5,node:6,nginx:7,lite:8}[k]]??0)); }
function sample(id,t){ const R=RUNS[id], n=R.length, f=clamp((t-5)/WIN,0,n-1), i=Math.min(Math.floor(f),n-2), a=f-i, A=R[i], B=R[i+1];
  const lg=(x,y)=> (x>0&&y>0)? Math.pow(10,lerp(Math.log10(x),Math.log10(y),a)) : lerp(x||0,y||0,a);
  return { t, rps:lerp(A[0]||0,B[0]||0,a), redirect:lg(A[1],B[1]), create:lg(A[2],B[2]), err:lerp(A[3]||0,B[3]||0,a), cpu:lerp(A[4]??0,B[4]??0,a), io:lerp(A[5]??0,B[5]??0,a), node:lerp(A[6]??0,B[6]??0,a), nginx:lerp(A[7]??0,B[7]??0,a), lite:lerp(A[8]??0,B[8]??0,a), cr:(A[9]!=null&&B[9]!=null)? lerp(A[9],B[9],a) : null }; }
const runLen=id=>RUNS[id].length*WIN;

// ---------- drawing helpers
function T(c,s,x,y,font,color,align='left'){ c.font=font; c.fillStyle=color; c.textAlign=align; c.textBaseline='alphabetic'; c.fillText(s,x,y); return c.measureText(s).width; }
function TW(c,s,font){ c.font=font; return c.measureText(s).width; }
function wrap(c,s,x,y,maxW,lh,font,color){ c.font=font; const words=s.split(' '); let line='', yy=y; for(const w of words){ const tst=line? line+' '+w : w; if(c.measureText(tst).width>maxW && line){ T(c,line,x,yy,font,color); line=w; yy+=lh; } else line=tst; } if(line) T(c,line,x,yy,font,color); return yy; }
function L(c,x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function head(c,x,y,a,s=12){ c.save(); c.translate(x,y); c.rotate(a); c.beginPath(); c.moveTo(0,0); c.lineTo(-s,-s*.42); c.lineTo(-s,s*.42); c.closePath(); c.fill(); c.restore(); }
function arrow(c,x1,y1,x2,y2,col,w=1.5,dash){ c.strokeStyle=col; c.fillStyle=col; c.lineWidth=w; if(dash) c.setLineDash(dash); const a=Math.atan2(y2-y1,x2-x1); L(c,x1,y1,x2-Math.cos(a)*9,y2-Math.sin(a)*9); c.setLineDash([]); head(c,x2,y2,a); }
function box(c,b,col,w=2){ c.strokeStyle=col; c.lineWidth=w; c.strokeRect(b.x,b.y,b.w,b.h); }
function check(c,x,y,s,col){ c.strokeStyle=col; c.lineWidth=s*.16; c.lineCap='round'; c.lineJoin='round'; c.beginPath(); c.moveTo(x-s*.38,y); c.lineTo(x-s*.1,y+s*.3); c.lineTo(x+s*.42,y-s*.36); c.stroke(); c.lineCap='butt'; }
function cross(c,x,y,s,col){ c.strokeStyle=col; c.lineWidth=s*.15; c.lineCap='round'; L(c,x-s*.34,y-s*.34,x+s*.34,y+s*.34); L(c,x-s*.34,y+s*.34,x+s*.34,y-s*.34); c.lineCap='butt'; }
function runTag(c,s){ T(c,s,W-60,H-34,fm(17),GREY,'right'); }
function heading(c,ev,title,col=INK){ let x=80; if(ev){ x+=T(c,ev,80,104,fm(26,500),INK)+22; } T(c,title,x,104,ft(36),col); }

// ---------- the system board: one fixed layout for every stage (nothing moves)
const G={ vis:60, M:{x:330,y:200,w:820,h:360}, N:{x:390,y:258,w:180,h:172}, O:{x:650,y:258,w:240,h:172}, Ls:{x:970,y:258,w:150,h:172}, V:{x:1250,y:292,w:210,h:104},
  reqY:338, resY:388, cpu:{x:470,y:503,w:560,h:14}, ch:{x:200,y:628,w:1180,h:160} };
const SPEC=s=> s<3? 'CX23 · 2 vCPU · 4 GB RAM · 40 GB disk · €5.99/mo' : s<6? 'CX33 · 4 vCPU · 8 GB RAM · 80 GB disk · €8.99/mo' : 'CX33 · 4 vCPU · 8 GB RAM · 80 GB disk · kept IP · €8.99/mo';
const entryX=s=> s>=2? G.N.x : G.O.x, turnX=G.O.x+G.O.w/2;

function drawBoard(c,b,o={}){ // b.stage, b.hi (keys drawn black), b.oldSpec, b.down, b.tags
  const s=b.stage, col=k=> (!b.hi||b.hi.includes(k))? INK : GREY;
  const M=G.M, mc=o.down? RED : col('machine');
  c.strokeStyle=mc; c.lineWidth=1.6; c.setLineDash([7,6]); c.strokeRect(M.x,M.y,M.w,M.h); c.setLineDash([]);
  let x=M.x; if(b.oldSpec){ const w=T(c,b.oldSpec,x,M.y-16,fm(19),GREY); c.strokeStyle=GREY; c.lineWidth=1.4; L(c,x,M.y-22,x+w,M.y-22); x+=w+22; }
  T(c,o.down? o.down : SPEC(s),x,M.y-16,fm(19),o.down? RED : col('machine'));
  if(s>=2){ box(c,G.N,col('nginx')); T(c,'nginx',G.N.x+G.N.w/2,G.N.y+40,ft(28),col('nginx'),'center'); }
  box(c,G.O,col('node')); T(c,'Node · SQLite',G.O.x+G.O.w/2,G.O.y+40,ft(26),col('node'),'center');
  if(b.nodeSub) b.nodeSub.forEach((l,i)=>T(c,l,G.O.x+G.O.w/2,G.O.y+G.O.h+30+i*22,fm(15),col('nodeSub'),'center'));
  if(s>=6){ box(c,G.Ls,col('lite')); T(c,'Litestream',G.Ls.x+G.Ls.w/2,G.Ls.y+40,ft(22),col('lite'),'center');
    box(c,G.V,col('vol')); T(c,'Volume',G.V.x+G.V.w/2,G.V.y+40,ft(24),col('vol'),'center'); T(c,'10 GB · €0.57/mo',G.V.x+G.V.w/2,G.V.y+72,fm(15),col('vol'),'center');
    arrow(c,G.O.x+G.O.w,G.reqY,G.Ls.x,G.reqY,col('lite'),1.4,[5,5]); arrow(c,G.Ls.x+G.Ls.w,G.reqY,G.V.x,G.reqY,col('vol'),1.4,[5,5]);
    T(c,'copy ≈ 1 s',(G.Ls.x+G.Ls.w+G.V.x)/2,G.reqY-12,fm(14),col('vol'),'center');
    T(c,'Better Stack checks /health every 30 s',W-60,G.M.y-16,fm(15),col('mon'),'right'); }
  if(s>=8 && b.showTakedown) T(c,'POST /takedown → 410',G.O.x+G.O.w/2,G.O.y+G.O.h+52,fm(15),col('nodeSub'),'center');
  // flow
  const fc=col('flow'), ex=entryX(s);
  arrow(c,G.vis,G.reqY,ex,G.reqY,fc); if(s>=2){ arrow(c,G.N.x+G.N.w,G.reqY,G.O.x,G.reqY,fc); arrow(c,G.O.x,G.resY,G.N.x+G.N.w,G.resY,fc); }
  arrow(c,ex,G.resY,G.vis,G.resY,fc);
  if(!o.noVis) T(c,'visitors',G.vis,G.reqY-64,ft(22),fc); T(c,'301',G.vis,G.resY+32,fm(17),fc);
}

// ---------- packets (sampled: one dot ≈ 30 requests)
const RATE=1/30, TA=.6, TB=.45, TC=.8, TD=.8, QROWS=7, QCAP=210;
const waitFor=p=> p<=40?0: clamp(Math.log10(p/40)*.6,0,1.6);
class Sim{ constructor(b){ this.p=[]; this.acc=0; this.cacc=0; this.now=0; this.per=(b&&b.perDot)||30; this.cr=0; }
  mk(s,born,cr){ const w=waitFor(s.redirect)*(.65+.7*Math.random()); const err=Math.random()*100<s.err; return {born,w,err,c:cr?1:0,j:Math.random()-.5,life:TA+w+(err?TD:TB+TC)}; }
  crNow(s){ return (s.cr!=null && this.cr>=0.5)? s.cr : this.cr; }
  warm(s){ this.p=[]; this.acc=0; this.cacc=0; const cr=this.crNow(s), dur=TA+waitFor(s.redirect)*1.35+TB+TC, n=Math.round(Math.max(0,s.rps-cr)/this.per*dur), nc=Math.round(cr/this.per*dur); for(let k=0;k<n;k++) this.p.push(this.mk(s,this.now-Math.random()*dur,0)); for(let k=0;k<nc;k++) this.p.push(this.mk(s,this.now-Math.random()*dur,1)); }
  step(dt,s,live){ this.now+=dt; if(live){ const cr=this.crNow(s); this.acc+=Math.max(0,s.rps-cr)/this.per*dt; this.cacc+=cr/this.per*dt; while(this.acc>=1){ this.acc--; this.p.push(this.mk(s,this.now-Math.random()*dt,0)); } while(this.cacc>=1){ this.cacc--; this.p.push(this.mk(s,this.now-Math.random()*dt,1)); } } this.p=this.p.filter(q=>this.now-q.born<q.life); }
  view(stage){ const pts=[], q=[], ex=entryX(stage), qx=ex-14;
    for(const p of this.p){ let a=this.now-p.born; if(a<0||a>=p.life) continue;
      if(a<TA){ const f=a/TA; pts.push({x:lerp(G.vis+8,qx,f), y:G.reqY+p.j*14*(1-f), c:p.c}); continue; }
      a-=TA; if(a<p.w){ q.push(p); continue; } a-=p.w;
      if(p.err){ const f=a/TD; pts.push({x:qx-12-f*10, y:G.reqY+f*f*150, e:1, o:1-f*f, c:p.c}); continue; }
      if(a<TB){ pts.push({x:lerp(ex+8,turnX,a/TB), y:G.reqY, c:p.c}); continue; }
      a-=TB; const f=a/TC; pts.push(f<.1? {x:turnX,y:lerp(G.reqY,G.resY,f/.1),c:p.c} : {x:lerp(turnX,G.vis+8,(f-.1)/.9), y:G.resY, c:p.c}); }
    q.sort((a,b)=>a.born-b.born); for(let k=0;k<Math.min(q.length,QCAP);k++) pts.push({x:qx-Math.floor(k/QROWS)*13, y:G.reqY-39+(k%QROWS)*13, c:q[k].c});
    return {pts,qn:q.length,qx}; }
}

// ---------- chart for a replay: x = the beat's time segment
function chart(c,b,t){ const g=G.ch, a=b.from, z=b.to, X=tt=>g.x+(tt-a)/(z-a)*g.w, R=RUNS[b.run];
  const metric=b.metric||'redirect';
  c.strokeStyle=INK; c.lineWidth=1; L(c,g.x,g.y+g.h,g.x+g.w,g.y+g.h);
  const span=(z-a)/60, stepM=span>8?2:1; for(let m=Math.ceil(a/60/stepM)*stepM; m*60<=z; m+=stepM){ const x=X(m*60); L(c,x,g.y+g.h,x,g.y+g.h+6); T(c,m+' min',x,g.y+g.h+26,fm(15),GREY,'center'); }
  if(metric==='answered'){
    const S=series(b.run,'answered'), mx=Math.max(...S)*1.12||1, Y=v=>g.y+g.h-v/mx*g.h;
    T(c,'redirects answered per second',g.x,g.y-14,ft(20),INK); [0,Math.round(mx/2/50)*50].forEach(v=>{ T(c,String(v),g.x-14,Y(v)+5,fm(15),GREY,'right'); });
    (b.marks||[]).forEach(m=>{ const x=X(m.t); c.strokeStyle=m.red?RED:GREY; c.lineWidth=1.2; c.setLineDash([5,5]); L(c,x,g.y,x,g.y+g.h); c.setLineDash([]); if(t>=m.t) T(c,m.label,x+(m.left?-8:8),g.y+(m.y||18),fm(15),m.red?RED:INK,m.left?'right':'left'); });
    c.strokeStyle=INK; c.lineWidth=2.4; c.beginPath(); let first=true;
    for(let i=0;i<R.length;i++){ const tc=i*WIN+5; if(tc<a||tc>t) continue; const x=X(tc), y=Y(S[i]); first? c.moveTo(x,y):c.lineTo(x,y); first=false; } c.stroke();
    return; }
  const idx=metric==='create'?2:1, lim=b.limit||(metric==='create'?300:100), Y=p=>g.y+g.h-lf(p)*g.h;
  T(c,metric==='create'?'create p99':'redirect p99',g.x,g.y-14,ft(20),INK);
  [[10,'10 ms'],[100,'100 ms'],[1000,'1 s'],[10000,'10 s']].forEach(([p,l])=>{ T(c,l,g.x-14,Y(p)+5,fm(15),GREY,'right'); c.strokeStyle=GREY; c.lineWidth=1; L(c,g.x-7,Y(p),g.x,Y(p)); });
  c.strokeStyle=RED; c.lineWidth=1.2; c.setLineDash([8,6]); L(c,g.x,Y(lim),g.x+g.w,Y(lim)); c.setLineDash([]); T(c,'limit '+lim+' ms',g.x+g.w,Y(lim)-9,fm(15),RED,'right');
  if(b.ghost){ const GR=RUNS[b.ghost]; c.strokeStyle=GREY; c.lineWidth=1.6; c.beginPath(); let f=true; GR.forEach((w,i)=>{ const tc=i*WIN+5; if(tc<a||tc>z||!w[idx]) return; const x=X(tc),y=Y(w[idx]); f? c.moveTo(x,y):c.lineTo(x,y); f=false; }); c.stroke(); if(b.ghostLabel) T(c,b.ghostLabel,X(lerp(a,z,.45)),Y(b.ghostAt||9000)-12,ft(17),GREY,'center'); }
  const pts=[]; R.forEach((w,i)=>{ const tc=i*WIN+5; if(tc>=a&&tc<=t&&w[idx]) pts.push([X(tc),w[idx]]); }); if(t>a){ const sv=sample(b.run,t)[metric]; if(sv) pts.push([X(t),sv]); }
  c.lineWidth=2.6; c.lineJoin='round';
  for(let i=1;i<pts.length;i++){ const [x1,p1]=pts[i-1],[x2,p2]=pts[i];
    if((p1-lim)*(p2-lim)<0){ const f=(Math.log10(lim)-Math.log10(p1))/(Math.log10(p2)-Math.log10(p1)), xm=lerp(x1,x2,f); c.strokeStyle=p1>=lim?RED:INK; L(c,x1,Y(p1),xm,Y(lim)); c.strokeStyle=p2>=lim?RED:INK; L(c,xm,Y(lim),x2,Y(p2)); }
    else { c.strokeStyle=(p1>=lim&&p2>=lim)?RED:INK; L(c,x1,Y(p1),x2,Y(p2)); } }
  if(pts.length){ const [ex,ep]=pts[pts.length-1], cl=ep>=lim?RED:INK; c.fillStyle=cl; c.beginPath(); c.arc(ex,Y(ep),5,0,Math.PI*2); c.fill(); T(c,ms(ep),Math.min(ex+12,g.x+g.w-90),Y(ep)-10,fm(19,500),cl); }
}

EP.forEach((b,i)=>{ if(b.ch!==chap){ chap=b.ch; sec=document.createElement('section'); sec.className='chapter'; const chT=EP.filter(x=>x.ch===chap).reduce((a,x)=>a+(x.sec||0),0); sec.innerHTML=`<h2>${chap}<span>${Math.round(chT/6)/10} min</span></h2>`; readEl.appendChild(sec); }
  n++; const d=document.createElement('article'); d.className='beat'; d.id='beat-'+(i+1);
  d.innerHTML=`<button class="thumb" type="button" aria-label="Present from beat ${i+1}"><canvas></canvas></button><div class="body"><div class="head"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${b.name}</h3><span class="dur">~${b.sec||0} s</span></div><p class="say">${b.say}</p><div class="meta">${b.screen&&b.screen.length? `<span>on screen: <b>${b.screen.join(' · ')}</b></span>`:'<span>on screen: no numbers</span>'}${b.src?`<span>source: ${b.src}</span>`:''}</div>${b.note?`<p class="note">${b.note}</p>`:''}</div>`;
  d.querySelector('.thumb').onclick=()=>{ show('present'); go(i,0); };
  sec.appendChild(d); thumbs.push({cv:d.querySelector('canvas'), b});
});
const steps=b=> b.kind==='replay'? 2 : (b.steps||1);
let STATIC=false;
function drawThumbs(){ STATIC=true; thumbs.forEach(({cv,b})=>{ const k=fitCanvas(cv,1.5); if(!cv.width) return; const c=cv.getContext('2d'); c.setTransform(k,0,0,k,0,0);
  let sim=null, t=0; if(b.kind==='replay'){ t=b.at??b.to; sim=new Sim(b); sim.warm({...sample(b.run,t)}); }
  renderBeat(c,b,steps(b)-1,t,sim,null); }); STATIC=false; }

// ---------- Present view
const live=document.getElementById('live'), lc=live.getContext('2d');
let bi=0, si=0, pt=0, playing=false, sim=new Sim(), enterAt=0, notesOn=true;
const notesEl=document.getElementById('notes'), posEl=document.getElementById('pos');
const jumpEl=document.getElementById('jump');
jumpEl.innerHTML=EP.map((b,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${b.ch} · ${b.name}</option>`).join('');
jumpEl.onchange=()=>{ go(+jumpEl.value,0); jumpEl.blur(); };
function go(i,s){ bi=clamp(i,0,EP.length-1); si=s; const b=EP[bi]; enterAt=performance.now();
  if(b.kind==='replay'){ pt=b.from; sim=new Sim(b); sim.warm(sample(b.run,pt)); playing=s>=1; }
  posEl.textContent=`${bi+1} / ${EP.length}`; jumpEl.value=String(bi); notesEl.innerHTML=`<p class="say">${b.say}</p><div class="meta">${b.name}${b.screen&&b.screen.length? ' · on screen: '+b.screen.join(' · '):''}</div>`; notesEl.hidden=!notesOn; }
function next(){ const b=EP[bi]; if(si<steps(b)-1){ si++; enterAt=performance.now(); if(b.kind==='replay'&&si===1) playing=true; } else if(bi<EP.length-1) go(bi+1,0); }
function prev(){ const b=EP[bi]; if(si>0){ if(b.kind==='replay') go(bi,0); else si--; } else if(bi>0){ go(bi-1,steps(EP[bi-1])-1); } }
function togglePlay(){ const b=EP[bi]; if(b.kind!=='replay') return; if(pt>=b.to){ go(bi,1); return; } playing=!playing; if(playing){ si=1; enterAt=performance.now()-1000; } }
function replay(){ go(bi,0); }
document.getElementById('next').onclick=next; document.getElementById('prev').onclick=prev; document.getElementById('replay').onclick=replay; const ppBtn=document.getElementById('pp'); ppBtn.onclick=togglePlay;
// ---------- laser pointer: drag to draw a trail that fades after LASER_LIFE seconds
// Its blue sits outside the notation on purpose: it is your hand, not part of the board.
const LASER='#2563eb', LASER_LIFE=1.4; let laserOn=false, drawing=false, trail=[], strokeId=0;
const laserBtn=document.getElementById('laser');
function setLaser(v){ laserOn=v; drawing=false; laserBtn.setAttribute('aria-pressed',v); laserBtn.textContent=v?'Laser on':'Laser off'; live.classList.toggle('laser',v); }
laserBtn.onclick=()=>setLaser(!laserOn);
const toBoard=e=>{ const r=live.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; };
live.addEventListener('pointerdown',e=>{ if(!laserOn){ next(); return; } drawing=true; strokeId++; try{ live.setPointerCapture(e.pointerId); }catch(_){} trail.push({...toBoard(e),t:performance.now(),id:strokeId}); });
live.addEventListener('pointermove',e=>{ if(laserOn&&drawing) trail.push({...toBoard(e),t:performance.now(),id:strokeId}); });
['pointerup','pointercancel'].forEach(ev=>live.addEventListener(ev,()=>{ drawing=false; }));
function drawLaser(c){ const now=performance.now(); trail=trail.filter(p=>now-p.t<LASER_LIFE*1000); if(!trail.length) return;
  c.lineCap='round'; c.lineJoin='round';
  for(let i=1;i<trail.length;i++){ const a=trail[i-1], b=trail[i]; if(a.id!==b.id) continue; const f=1-(now-b.t)/(LASER_LIFE*1000);
    c.globalAlpha=clamp(f,0,1); c.strokeStyle=LASER; c.lineWidth=2+6*f; L(c,a.x,a.y,b.x,b.y); }
  const p=trail[trail.length-1]; if(drawing){ c.globalAlpha=1; c.fillStyle=LASER; c.beginPath(); c.arc(p.x,p.y,7,0,Math.PI*2); c.fill(); }
  c.globalAlpha=1; c.lineCap='butt'; }
const screenEl=document.getElementById('screen');
document.getElementById('full').onclick=()=>{ try{ (screenEl.requestFullscreen? screenEl.requestFullscreen(): Promise.reject()).catch(()=>{}); }catch(e){} };
document.addEventListener('keydown',e=>{ if(document.getElementById('present').hidden || e.target===jumpEl) return; if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); } else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); } else if(e.key==='r'||e.key==='R') replay(); else if(e.key==='p'||e.key==='P') togglePlay(); else if(e.key==='n'||e.key==='N'){ notesOn=!notesOn; notesEl.hidden=!notesOn; } else if(e.key==='f'||e.key==='F') document.getElementById('full').click(); else if(e.key==='l'||e.key==='L') setLaser(!laserOn); else if(e.key==='Escape'&&laserOn) setLaser(false); });

let last=performance.now();
function tick(ts){ const dt=Math.min(.05,(ts-last)/1000); last=ts;
  if(!document.getElementById('present').hidden){ const b=EP[bi], k=fitCanvas(live,2); lc.setTransform(k,0,0,k,0,0);
    if(b.kind==='replay'){ const sp=(b.to-b.from)/(b.dur||12); if(playing && performance.now()-enterAt>500){ pt=Math.min(b.to,pt+dt*sp); if(pt>=b.to) playing=false; } if(playing) sim.step(dt,sample(b.run,pt),true); }
    ppBtn.disabled=b.kind!=='replay'; ppBtn.textContent= b.kind==='replay' && playing ? 'Pause' : 'Play';
    renderBeat(lc,b,si,pt,sim,(performance.now()-enterAt)/1000); drawLaser(lc); }
  requestAnimationFrame(tick); }

// ---------- tabs
function show(v){ const p=v==='present'; document.getElementById('read').hidden=p; document.getElementById('present').hidden=!p; document.getElementById('tab-read').setAttribute('aria-selected',!p); document.getElementById('tab-present').setAttribute('aria-selected',p); if(p) window.scrollTo(0,0); }
document.getElementById('tab-read').onclick=()=>show('read'); document.getElementById('tab-present').onclick=()=>{ show('present'); go(bi,si); };
go(0,0); drawThumbs(); if(document.fonts) document.fonts.ready.then(drawThumbs);
let rT=0; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(drawThumbs,150); });
requestAnimationFrame(tick);
</script>
