<main><div id="stage" class="concealed" tabindex="0" aria-label="Presentation canvas"></div><nav aria-label="Presentation controls"><button id="prev">← Back</button><button id="next">Reveal / Next →</button><span id="progress" aria-live="polite"></span><select id="jump" aria-label="Choose frame"></select><button id="noteButton">Presenter notes</button><button id="record">Recording view</button><button id="full">Fullscreen</button></nav><p id="hint">Space / →: reveal question, then advance · ←: back · N: notes · R: clean recording view · Esc: exit recording view. Frames 16–18 are optional. Notes stay outside the capture area.</p><div id="notes" hidden></div></main>
<script>const slides=[{"title": "Two buyers. One last pair.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Two buyers. One last pair.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 01<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Two buyers. One last pair.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Our reconstruction<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">What is the smallest store we could build?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">01<\/text><rect x=\"70\" y=\"240\" width=\"290\" height=\"150\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"90\" y=\"308.0\" font-size=\"28\" fill=\"#2463a0\">Alice<\/text><text x=\"90\" y=\"343.0\" font-size=\"28\" fill=\"#2463a0\">Order accepted<\/text><rect x=\"840\" y=\"240\" width=\"290\" height=\"150\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"860\" y=\"308.0\" font-size=\"28\" fill=\"#ab571c\">Bob<\/text><text x=\"860\" y=\"343.0\" font-size=\"28\" fill=\"#ab571c\">Order accepted<\/text><rect x=\"460\" y=\"260\" width=\"280\" height=\"130\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"480\" y=\"337.0\" font-size=\"32\" fill=\"#263442\">Stock: 1 pair<\/text><path d=\"M 375 310 l 70 0\" stroke=\"#2463a0\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><path d=\"M 825 310 l -70 0\" stroke=\"#ab571c\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><text x=\"395\" y=\"491.0\" font-size=\"32\" fill=\"#b13c41\">Two promises. One unit.<\/text><\/svg>", "notes": "Alice and Bob both press Buy. The store accepts both orders. But there is only one pair left. Someone is going to be disappointed.\n\nLet\u2019s build this store from a blank page. We\u2019ll start with the simplest thing that could work, break it, and add only what we need next. Along the way, we\u2019ll compare our choices with failures Shopify has written about. This is our reconstruction, not their development timeline.", "cue": "Point to each accepted order, then the single pair. Reveal the question; do not zoom out to later frames.", "appendix": false}, {"title": "One number seems enough.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"One number seems enough.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 02<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">One number seems enough.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Our reconstruction<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">Both read 1. Both write 0. Which step must become indivisible?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">02<\/text><rect x=\"65\" y=\"220\" width=\"335\" height=\"260\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"85\" y=\"311.0\" font-size=\"26\" fill=\"#263442\">read quantity<\/text><text x=\"85\" y=\"343.5\" font-size=\"26\" fill=\"#263442\">if positive:<\/text><text x=\"85\" y=\"376.0\" font-size=\"26\" fill=\"#263442\">  accept order<\/text><text x=\"85\" y=\"408.5\" font-size=\"26\" fill=\"#263442\">  write quantity - 1<\/text><text x=\"455\" y=\"238.0\" font-size=\"18\" fill=\"#687583\">TIME<\/text><text x=\"555\" y=\"242.0\" font-size=\"22\" fill=\"#2463a0\">ALICE<\/text><text x=\"820\" y=\"242.0\" font-size=\"22\" fill=\"#ab571c\">BOB<\/text><text x=\"555\" y=\"299.0\" font-size=\"29\" fill=\"#2463a0\">reads 1<\/text><text x=\"820\" y=\"299.0\" font-size=\"29\" fill=\"#ab571c\"><\/text><text x=\"555\" y=\"349.0\" font-size=\"29\" fill=\"#2463a0\"><\/text><text x=\"820\" y=\"349.0\" font-size=\"29\" fill=\"#ab571c\">reads 1<\/text><text x=\"555\" y=\"399.0\" font-size=\"29\" fill=\"#2463a0\">writes 0<\/text><text x=\"820\" y=\"399.0\" font-size=\"29\" fill=\"#ab571c\"><\/text><text x=\"555\" y=\"449.0\" font-size=\"29\" fill=\"#2463a0\"><\/text><text x=\"820\" y=\"449.0\" font-size=\"29\" fill=\"#ab571c\">writes 0<\/text><path d=\"M 475 270 l 0 198\" stroke=\"#687583\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><\/svg>", "notes": "Our first version stores one number. Read it. If it is positive, accept the order and subtract one.\n\nWith one shopper at a time, that works. Alice sees one; after her purchase, Bob sees zero. Now let\u2019s overlap them. Alice reads one. Before she writes anything, Bob reads one too. Alice accepts her order and writes zero. Bob does exactly the same.\n\nTwo orders, one pair, and the database still says zero. The number looks fine. The promises are wrong. This is a race condition: our check and our change were separate steps.", "cue": "Trace down the timeline slowly. Pause after both reads before tracing the writes.", "appendix": false}, {"title": "Check and subtract together.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Check and subtract together.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 03<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Check and subtract together.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Our reconstruction<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">We acquired stock. But what if payment fails?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">03<\/text><rect x=\"60\" y=\"225\" width=\"630\" height=\"235\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"80\" y=\"300.5\" font-size=\"28\" fill=\"#263442\">UPDATE inventory<\/text><text x=\"80\" y=\"335.5\" font-size=\"28\" fill=\"#263442\">SET available = available - 1<\/text><text x=\"80\" y=\"370.5\" font-size=\"28\" fill=\"#263442\">WHERE item_id = 42<\/text><text x=\"80\" y=\"405.5\" font-size=\"28\" fill=\"#263442\">  AND available &gt; 0;<\/text><rect x=\"765\" y=\"225\" width=\"375\" height=\"100\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"785\" y=\"285.5\" font-size=\"28\" fill=\"#2463a0\">Alice: acquired 1<\/text><rect x=\"765\" y=\"360\" width=\"375\" height=\"100\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"785\" y=\"420.5\" font-size=\"28\" fill=\"#ab571c\">Bob: acquired 0<\/text><\/svg>", "notes": "Let the database check and subtract in one operation. Only subtract if availability is still positive.\n\nAlice\u2019s update changes one row. Bob\u2019s competing update cannot reuse that same availability. It changes zero rows. We check that result and the successful commit before promising anything.\n\nWe have fixed the stock race. But we have not finished checkout. Alice still needs to pay.", "cue": "Trace the condition before the subtraction. Call this an atomic stock decision, not a completed purchase.", "appendix": false}, {"title": "Payment takes time.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Payment takes time.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 04<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Payment takes time.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Our reconstruction<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">If we promise stock before payment, how do we remember the promise?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">04<\/text><rect x=\"60\" y=\"230\" width=\"510\" height=\"250\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"80\" y=\"313.0\" font-size=\"28\" fill=\"#ab571c\">SUBTRACT AFTER PAYMENT<\/text><text x=\"80\" y=\"348.0\" font-size=\"28\" fill=\"#ab571c\"><\/text><text x=\"80\" y=\"383.0\" font-size=\"28\" fill=\"#ab571c\">Alice pays. Bob pays.<\/text><text x=\"80\" y=\"418.0\" font-size=\"28\" fill=\"#ab571c\">Only one gets stock.<\/text><rect x=\"630\" y=\"230\" width=\"510\" height=\"250\" rx=\"12\" fill=\"#fcebed\" stroke=\"#b13c41\" stroke-width=\"2\"/><text x=\"650\" y=\"313.0\" font-size=\"28\" fill=\"#b13c41\">SUBTRACT BEFORE PAYMENT<\/text><text x=\"650\" y=\"348.0\" font-size=\"28\" fill=\"#b13c41\"><\/text><text x=\"650\" y=\"383.0\" font-size=\"28\" fill=\"#b13c41\">Alice abandons checkout.<\/text><text x=\"650\" y=\"418.0\" font-size=\"28\" fill=\"#b13c41\">Availability stays missing.<\/text><\/svg>", "notes": "When should we subtract? After payment sounds natural, until two people pay and only one gets the stock. The other needs a refund.\n\nBefore payment avoids that, but now Alice closes her tab. We have removed availability without making a sale.\n\nSo, add it back when she fails? Yes\u2014but what if our server crashes before doing that? We need to remember who we set the unit aside for, so we can finish or undo that promise later.", "cue": "Treat \u201cadd it back\u201d as a sensible intermediate idea. Let the server-crash question motivate durable state.", "appendix": false}, {"title": "Remember a temporary hold.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Remember a temporary hold.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 05<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Remember a temporary hold.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">Works for two shoppers. What happens during a flash sale?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">05<\/text><rect x=\"60\" y=\"275\" width=\"240\" height=\"135\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"80\" y=\"335.5\" font-size=\"28\" fill=\"#263442\">Available<\/text><text x=\"80\" y=\"370.5\" font-size=\"28\" fill=\"#263442\">1 pair<\/text><rect x=\"450\" y=\"275\" width=\"270\" height=\"135\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"470\" y=\"335.5\" font-size=\"28\" fill=\"#2463a0\">Held for Alice<\/text><text x=\"470\" y=\"370.5\" font-size=\"28\" fill=\"#2463a0\">0 available<\/text><rect x=\"870\" y=\"215\" width=\"270\" height=\"110\" rx=\"12\" fill=\"#e9f3eb\" stroke=\"#317156\" stroke-width=\"2\"/><text x=\"890\" y=\"263.0\" font-size=\"28\" fill=\"#317156\">Claim<\/text><text x=\"890\" y=\"298.0\" font-size=\"28\" fill=\"#317156\">Sale recorded<\/text><rect x=\"870\" y=\"390\" width=\"270\" height=\"110\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"890\" y=\"438.0\" font-size=\"28\" fill=\"#263442\">Release<\/text><text x=\"890\" y=\"473.0\" font-size=\"28\" fill=\"#263442\">Available again<\/text><path d=\"M 318 340 l 115 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><path d=\"M 740 312 l 113 -42\" stroke=\"#317156\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><path d=\"M 740 365 l 113 75\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><text x=\"60\" y=\"486.0\" font-size=\"28\" fill=\"#2463a0\">Short DB lock  \u2260  payment-length hold<\/text><\/svg>", "notes": "That remembered promise is a reservation. In a short database transaction, we take one unit of availability and record Alice\u2019s hold. Then we commit and release the database lock.\n\nPayment happens after that. If it succeeds, another short transaction turns the hold into a sale. If it fails, we release the hold. An abandoned hold needs expiry and recovery.\n\nNotice the distinction: the hold lasts while Alice pays. The database lock does not. And claim and release must be safe to retry, so the same pair is not deducted or returned twice.", "cue": "Follow one branch, then reset and follow the other. The two outcomes are alternatives.", "appendix": false}, {"title": "Now sell 100 pairs to thousands.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Now sell 100 pairs to thousands.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 06<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Now sell 100 pairs to thousands.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">One row is the measured bottleneck. Could a faster counter help?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">06<\/text><rect x=\"70\" y=\"270\" width=\"110\" height=\"90\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"90\" y=\"324.0\" font-size=\"24\" fill=\"#2463a0\">Buy<\/text><rect x=\"210\" y=\"270\" width=\"110\" height=\"90\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"230\" y=\"324.0\" font-size=\"24\" fill=\"#2463a0\">Buy<\/text><rect x=\"350\" y=\"270\" width=\"110\" height=\"90\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"370\" y=\"324.0\" font-size=\"24\" fill=\"#2463a0\">Buy<\/text><rect x=\"490\" y=\"270\" width=\"110\" height=\"90\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"510\" y=\"324.0\" font-size=\"24\" fill=\"#2463a0\">Buy<\/text><path d=\"M 635 315 l 155 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><rect x=\"820\" y=\"255\" width=\"320\" height=\"150\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"840\" y=\"322.0\" font-size=\"32\" fill=\"#263442\">One item row<\/text><text x=\"840\" y=\"362.0\" font-size=\"32\" fill=\"#263442\">100 pairs<\/text><text x=\"75\" y=\"455.0\" font-size=\"32\" fill=\"#263442\">Every reservation takes a turn here.<\/text><\/svg>", "notes": "Let\u2019s change the workload. We have a hundred pairs and thousands of shoppers. This is no longer just a race for one unit.\n\nOur first reservation design still updates one item row for every hold. Each update is short, but all of them have to take turns on that row. Under enough load, the line grows faster than it clears.\n\nWe should first shorten the transactions and measure the wait. But if this row still limits us, adding application servers just sends more requests into the same line. Shopify reports contention in a single-row MySQL attempt too. We are meeting that failure here in our teaching order.", "cue": "Explicitly announce the new stock count. Do not imply that one last pair permits parallel winners.", "appendix": false}, {"title": "Try a fast counter in Redis.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Try a fast counter in Redis.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 07<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Try a fast counter in Redis.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">Payment succeeds. Now two inventory records must change.<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">07<\/text><rect x=\"70\" y=\"285\" width=\"265\" height=\"145\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"90\" y=\"368.0\" font-size=\"28\" fill=\"#263442\">Checkout<\/text><rect x=\"720\" y=\"215\" width=\"400\" height=\"120\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"740\" y=\"268.0\" font-size=\"28\" fill=\"#ab571c\">Redis<\/text><text x=\"740\" y=\"303.0\" font-size=\"28\" fill=\"#ab571c\">availability + holds<\/text><rect x=\"720\" y=\"385\" width=\"400\" height=\"120\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"740\" y=\"438.0\" font-size=\"28\" fill=\"#263442\">MySQL<\/text><text x=\"740\" y=\"473.0\" font-size=\"28\" fill=\"#263442\">unsold stock<\/text><path d=\"M 355 320 l 345 -45\" stroke=\"#ab571c\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><path d=\"M 355 365 l 345 80\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><text x=\"380\" y=\"250.0\" font-size=\"25\" fill=\"#ab571c\">reserve<\/text><text x=\"380\" y=\"477.0\" font-size=\"25\" fill=\"#263442\">claim after payment<\/text><\/svg>", "notes": "Let\u2019s try an in-memory store for the busy reservation counter. MySQL keeps our permanent stock records; Redis manages the holds.\n\nWe still need an atomic check-and-take operation. A bare decrement is not enough: it can take the counter below zero. We also still have to remember ownership and handle retries.\n\nSuppose this meets our speed target. Now Alice pays. We need to update the permanent stock record and clear her hold. Those changes are in two systems. This is the split-state risk Shopify describes in its previous design.", "cue": "Draw both stores as inventory state. Redis is an experiment earned by the preceding measurement.", "appendix": false}, {"title": "Crash between the two writes.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Crash between the two writes.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 08<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Crash between the two writes.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">Can the hold and the stock ledger change in one transaction?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">08<\/text><rect x=\"60\" y=\"235\" width=\"310\" height=\"170\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"80\" y=\"295.5\" font-size=\"28\" fill=\"#263442\">BEFORE CLAIM<\/text><text x=\"80\" y=\"330.5\" font-size=\"28\" fill=\"#263442\">Stock 1 - holds 1<\/text><text x=\"80\" y=\"365.5\" font-size=\"28\" fill=\"#263442\">Available: 0<\/text><rect x=\"445\" y=\"235\" width=\"310\" height=\"170\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"465\" y=\"295.5\" font-size=\"28\" fill=\"#263442\">CLEAR HOLD<\/text><text x=\"465\" y=\"330.5\" font-size=\"28\" fill=\"#263442\">Stock 1 - holds 0<\/text><text x=\"465\" y=\"365.5\" font-size=\"28\" fill=\"#263442\">Available: 1<\/text><rect x=\"830\" y=\"235\" width=\"310\" height=\"170\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"850\" y=\"295.5\" font-size=\"28\" fill=\"#263442\">CRASH<\/text><text x=\"850\" y=\"330.5\" font-size=\"28\" fill=\"#263442\">Stock deduction<\/text><text x=\"850\" y=\"365.5\" font-size=\"28\" fill=\"#263442\">never happens<\/text><path d=\"M 382 320 l 47 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><path d=\"M 767 320 l 47 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><text x=\"75\" y=\"482.0\" font-size=\"30\" fill=\"#b13c41\">Payment succeeded; inventory state disagrees.<\/text><\/svg>", "notes": "Here is a simplified way to see the danger. Availability is unsold stock minus active holds. We have one unit and Alice holds it, so availability is zero.\n\nAlice pays. We clear her hold first. But before we deduct the sold unit from MySQL, the server crashes. Now the calculation says one unit is available again. Another checkout can promise the same pair.\n\nReversing the writes can hide stock after a crash instead. We could build a repair protocol. Or we could put the inventory changes together. But didn\u2019t one database already give us that awful line?", "cue": "Trace 1 minus 1, then 1 minus 0. This arithmetic is our illustration, not Shopify\u2019s exact Redis algorithm.", "appendix": false}, {"title": "Must every buyer touch one row?", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Must every buyer touch one row?\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 09<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Must every buyer touch one row?<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Our reconstruction<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">There is another free unit. Why should Bob wait for Alice\u2019s row?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">09<\/text><rect x=\"60\" y=\"255\" width=\"290\" height=\"180\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"80\" y=\"338.0\" font-size=\"28\" fill=\"#263442\">One item row<\/text><text x=\"80\" y=\"373.0\" font-size=\"28\" fill=\"#263442\">quantity: 3<\/text><path d=\"M 370 340 l 175 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><rect x=\"600\" y=\"210\" width=\"530\" height=\"80\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"620\" y=\"260.5\" font-size=\"28\" fill=\"#2463a0\">A: Alice is locking it<\/text><rect x=\"600\" y=\"320\" width=\"530\" height=\"80\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"620\" y=\"370.5\" font-size=\"28\" fill=\"#263442\">B: free<\/text><rect x=\"600\" y=\"430\" width=\"530\" height=\"80\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"620\" y=\"480.5\" font-size=\"28\" fill=\"#263442\">C: free<\/text><\/svg>", "notes": "Maybe the problem was not simply that we used MySQL. Maybe it was what we asked everyone to update.\n\nInstead of one row saying three units, let\u2019s represent three available units with three rows. These are stock permits, not serial numbers on individual shoes.\n\nAlice can take one, Bob another. But with ordinary locking, Bob might try the row Alice is already working on and wait\u2014even while another candidate is free. Can he use that other row?", "cue": "Introduce separate rows first. Do not name SKIP LOCKED until the next frame.", "appendix": false}, {"title": "Skip busy rows. Take a free one.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Skip busy rows. Take a free one.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 10<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Skip busy rows. Take a free one.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">A short lock chose the unit. What remembers it after commit?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">10<\/text><rect x=\"60\" y=\"240\" width=\"265\" height=\"100\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"80\" y=\"300.5\" font-size=\"28\" fill=\"#2463a0\">Alice<\/text><rect x=\"60\" y=\"390\" width=\"265\" height=\"100\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"80\" y=\"450.5\" font-size=\"28\" fill=\"#ab571c\">Bob<\/text><rect x=\"730\" y=\"230\" width=\"400\" height=\"80\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"750\" y=\"280.5\" font-size=\"28\" fill=\"#2463a0\">A: locked by Alice<\/text><rect x=\"730\" y=\"365\" width=\"400\" height=\"80\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"750\" y=\"415.5\" font-size=\"28\" fill=\"#ab571c\">B: Bob takes this<\/text><path d=\"M 345 287 l 360 -19\" stroke=\"#2463a0\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><path d=\"M 345 434 l 360 -29\" stroke=\"#ab571c\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><text x=\"385\" y=\"354.0\" font-size=\"30\" fill=\"#263442\">SKIP LOCKED<\/text><text x=\"730\" y=\"505.0\" font-size=\"25\" fill=\"#b13c41\">No row \u2260 sold out<\/text><\/svg>", "notes": "That is what SKIP LOCKED gives us. While Alice\u2019s transaction locks A, Bob skips it and selects B. Separate buyers can acquire separate units without waiting for the same row.\n\nIt does not create stock. With one unit left, there is still only one winner. And getting no rows back does not prove sold out: some candidates may just be busy.\n\nThe lock only protects this short transaction. Before releasing it, we need to turn the selected unit into a durable hold.", "cue": "Point at A, skip to B, then contrast the temporary row lock with the recorded hold.", "appendix": false}, {"title": "Two short transactions. Payment between.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Two short transactions. Payment between.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 11<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Two short transactions. Payment between.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Our reconstruction<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">Correct inventory transitions. But do we need a row for all stock?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">11<\/text><rect x=\"60\" y=\"225\" width=\"370\" height=\"265\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"80\" y=\"300.125\" font-size=\"27\" fill=\"#2463a0\">1 / RESERVE IN DB<\/text><text x=\"80\" y=\"333.875\" font-size=\"27\" fill=\"#2463a0\"><\/text><text x=\"80\" y=\"367.625\" font-size=\"27\" fill=\"#2463a0\">Take unit row<\/text><text x=\"80\" y=\"401.375\" font-size=\"27\" fill=\"#2463a0\">Create durable hold<\/text><text x=\"80\" y=\"435.125\" font-size=\"27\" fill=\"#2463a0\">COMMIT<\/text><rect x=\"490\" y=\"300\" width=\"220\" height=\"115\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"510\" y=\"351.25\" font-size=\"25\" fill=\"#ab571c\">2 / PAYMENT<\/text><text x=\"510\" y=\"382.5\" font-size=\"25\" fill=\"#ab571c\">External<\/text><rect x=\"770\" y=\"225\" width=\"370\" height=\"265\" rx=\"12\" fill=\"#e9f3eb\" stroke=\"#317156\" stroke-width=\"2\"/><text x=\"790\" y=\"300.125\" font-size=\"27\" fill=\"#317156\">3 / CLAIM IN DB<\/text><text x=\"790\" y=\"333.875\" font-size=\"27\" fill=\"#317156\"><\/text><text x=\"790\" y=\"367.625\" font-size=\"27\" fill=\"#317156\">Deduct stock<\/text><text x=\"790\" y=\"401.375\" font-size=\"27\" fill=\"#317156\">End active hold<\/text><text x=\"790\" y=\"435.125\" font-size=\"27\" fill=\"#317156\">COMMIT<\/text><path d=\"M 443 357 l 32 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><path d=\"M 725 357 l 30 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><\/svg>", "notes": "In the reserve transaction, remove the selected available row and create the hold together. Commit. The database lock is gone; the hold remains.\n\nThen call the payment provider. Later, the claim transaction validates the active hold, deducts the stock ledger and ends the hold together.\n\nThe inventory records now change atomically within each transaction. Payment is still outside. Lost responses, retries and late payment results still need recovery. We have solved one specific consistency gap, not every checkout failure.", "cue": "Trace left to right. Emphasize the two COMMIT boundaries and payment outside both boxes.", "appendix": false}, {"title": "Keep a small pool ready.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Keep a small pool ready.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 12<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Keep a small pool ready.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">If the pool empties, is the warehouse really empty?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">12<\/text><rect x=\"60\" y=\"245\" width=\"310\" height=\"225\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"80\" y=\"333.0\" font-size=\"28\" fill=\"#263442\">Inventory ledger<\/text><text x=\"80\" y=\"368.0\" font-size=\"28\" fill=\"#263442\"><\/text><text x=\"80\" y=\"403.0\" font-size=\"28\" fill=\"#263442\">Unpromised stock<\/text><path d=\"M 390 350 l 180 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><text x=\"406\" y=\"312.0\" font-size=\"24\" fill=\"#263442\">refill<\/text><rect x=\"610\" y=\"260\" width=\"105\" height=\"105\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"630\" y=\"324.5\" font-size=\"32\" fill=\"#263442\">1<\/text><rect x=\"740\" y=\"260\" width=\"105\" height=\"105\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"760\" y=\"324.5\" font-size=\"32\" fill=\"#263442\">1<\/text><rect x=\"870\" y=\"260\" width=\"105\" height=\"105\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"890\" y=\"324.5\" font-size=\"32\" fill=\"#263442\">1<\/text><rect x=\"1000\" y=\"260\" width=\"105\" height=\"105\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"1020\" y=\"324.5\" font-size=\"32\" fill=\"#263442\">1<\/text><text x=\"610\" y=\"430.0\" font-size=\"30\" fill=\"#263442\">Ready permits<\/text><text x=\"610\" y=\"481.0\" font-size=\"28\" fill=\"#b13c41\">Empty pool \u2260 sold out<\/text><\/svg>", "notes": "A row per unit gave us concurrency. But storing every unit that way can make the working table much larger than it needs to be.\n\nKeep a small pool of available permits ready, and refill it from inventory that has not already been promised. Think shelf and storeroom. The shelf is part of the stock, not extra stock.\n\nAn empty pool must trigger a check or refill path, not an automatic sold-out message. Shopify documents an inline refill fallback with one replenisher while other requests wait. Their cap was a thousand rows per item and location, chosen from observed load. Our cap would need measurement too. That wait is a deliberate tradeoff when the ready pool runs dry.", "cue": "Distinguish permits from additional inventory. Source cap and refill details are in the evidence notes.", "appendix": false}, {"title": "Fast query. No connection available.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Fast query. No connection available.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 13<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Fast query. No connection available.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">What is holding the connections, and for how long?<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">13<\/text><rect x=\"60\" y=\"290\" width=\"310\" height=\"145\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"80\" y=\"355.5\" font-size=\"28\" fill=\"#ab571c\">Reservation<\/text><text x=\"80\" y=\"390.5\" font-size=\"28\" fill=\"#ab571c\">waiting for a slot<\/text><path d=\"M 390 362 l 150 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><rect x=\"575\" y=\"225\" width=\"565\" height=\"75\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"595\" y=\"272.25\" font-size=\"26\" fill=\"#263442\">Connection 1: checkout work<\/text><rect x=\"575\" y=\"325\" width=\"565\" height=\"75\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"595\" y=\"372.25\" font-size=\"26\" fill=\"#263442\">Connection 2: checkout work<\/text><rect x=\"575\" y=\"425\" width=\"565\" height=\"75\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"595\" y=\"472.25\" font-size=\"26\" fill=\"#263442\">Connection 3: checkout work<\/text><\/svg>", "notes": "Now we load-test the whole checkout. Our reservation query is fast, but checkout still stalls.\n\nLook earlier in the request: it is waiting for a database connection. These sessions are shared and limited. Other checkout work is holding them too long. A fast query cannot run without a slot.\n\nShopify found this problem outside the reservation code. So the next thing we add is measurement: who holds each connection, and for how long? Then we shorten the work responsible. This is the kind of finding that changes a design because we observed the whole system, not because we guessed another database feature.", "cue": "Trace the waiting request to occupied slots before discussing CPU. Keep exact metrics off the main canvas.", "appendix": false}, {"title": "How do we replace it while open?", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"How do we replace it while open?\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 14<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">How do we replace it while open?<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">Compare outcomes. Expand gradually. Keep a tested way back.<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">14<\/text><rect x=\"60\" y=\"280\" width=\"280\" height=\"140\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"80\" y=\"360.5\" font-size=\"28\" fill=\"#263442\">Live checkout<\/text><rect x=\"760\" y=\"215\" width=\"380\" height=\"120\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"780\" y=\"268.0\" font-size=\"28\" fill=\"#2463a0\">Old path<\/text><text x=\"780\" y=\"303.0\" font-size=\"28\" fill=\"#2463a0\">serves buyers<\/text><rect x=\"760\" y=\"385\" width=\"380\" height=\"120\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"780\" y=\"438.0\" font-size=\"28\" fill=\"#263442\">New path<\/text><text x=\"780\" y=\"473.0\" font-size=\"28\" fill=\"#263442\">compare outcomes<\/text><path d=\"M 360 320 l 380 -45\" stroke=\"#2463a0\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><path d=\"M 360 370 l 380 70\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><text x=\"400\" y=\"251.0\" font-size=\"26\" fill=\"#2463a0\">one authority<\/text><\/svg>", "notes": "The new design passes our tests. But the existing store is still taking orders. We cannot turn a prototype into the authority just because the diagram looks convincing.\n\nRun the new path alongside the old one and compare business outcomes. Keep one authority for serving buyers. Investigate disagreements. Then change the authority gradually, with a maintained way back if the new path misbehaves.\n\nThat is the rollout pattern Shopify describes. Shipping the replacement is another problem we have to solve. It deserves the same small-step approach as building it.", "cue": "Explain authority for reservations; the permanent inventory ledger is not being declared Redis.", "appendix": false}, {"title": "Every piece has a reason.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Every piece has a reason.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">BUILD 15<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Every piece has a reason.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Our reconstruction<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">Build something small. Observe the failure. Earn the next change.<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">15<\/text><text x=\"60\" y=\"230.0\" font-size=\"25\" fill=\"#687583\">Two shoppers race<\/text><text x=\"60\" y=\"270.0\" font-size=\"29\" fill=\"#263442\">Atomic stock decision<\/text><text x=\"640\" y=\"230.0\" font-size=\"25\" fill=\"#687583\">Payment takes time<\/text><text x=\"640\" y=\"270.0\" font-size=\"29\" fill=\"#263442\">Durable hold<\/text><text x=\"60\" y=\"310.0\" font-size=\"25\" fill=\"#687583\">One row becomes a line<\/text><text x=\"60\" y=\"350.0\" font-size=\"29\" fill=\"#263442\">Try a faster reserve path<\/text><text x=\"640\" y=\"310.0\" font-size=\"25\" fill=\"#687583\">Two stores disagree<\/text><text x=\"640\" y=\"350.0\" font-size=\"29\" fill=\"#263442\">Commit inventory changes together<\/text><text x=\"60\" y=\"390.0\" font-size=\"25\" fill=\"#687583\">Too many unit rows<\/text><text x=\"60\" y=\"430.0\" font-size=\"29\" fill=\"#263442\">Bounded ready pool<\/text><text x=\"640\" y=\"390.0\" font-size=\"25\" fill=\"#687583\">Ready pool empties<\/text><text x=\"640\" y=\"430.0\" font-size=\"29\" fill=\"#263442\">Check stock and refill<\/text><text x=\"60\" y=\"470.0\" font-size=\"25\" fill=\"#687583\">Checkout still stalls<\/text><text x=\"60\" y=\"510.0\" font-size=\"29\" fill=\"#263442\">Measure shared connections<\/text><text x=\"640\" y=\"470.0\" font-size=\"25\" fill=\"#687583\">Replacing a live store<\/text><text x=\"640\" y=\"510.0\" font-size=\"29\" fill=\"#263442\">Shadow + gradual rollout<\/text><\/svg>", "notes": "We started with a number. Two shoppers raced, so we made the stock decision atomic. Payment took time, so we remembered a hold. A hot row limited throughput, so we tried a faster counter. Two stores could disagree, so we brought inventory changes together and changed how we represented available units.\n\nMore stock earned a bounded pool. A wider load test exposed shared connections. A running store earned a gradual rollout.\n\nWe did not know this diagram at the start. And it is not the only possible answer. Every piece has a job because we can point to the failure that made us add it. That is how we will keep building systems from first principles.", "cue": "Only now zoom out. Trace failures before naming their fixes. Finish without presenting this as the inevitable final architecture.", "appendix": false}, {"title": "Optional: the index path takes locks.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Optional: the index path takes locks.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">OPTIONAL NOTE<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Optional: the index path takes locks.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">Measure the access path before changing the key.<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">16<\/text><rect x=\"60\" y=\"220\" width=\"480\" height=\"215\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"80\" y=\"320.25\" font-size=\"29\" fill=\"#263442\">Secondary index<\/text><text x=\"80\" y=\"356.5\" font-size=\"29\" fill=\"#263442\">Find candidate<\/text><rect x=\"660\" y=\"220\" width=\"480\" height=\"215\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"680\" y=\"320.25\" font-size=\"29\" fill=\"#263442\">Primary-key record<\/text><text x=\"680\" y=\"356.5\" font-size=\"29\" fill=\"#263442\">Reach the row<\/text><path d=\"M 555 327 l 85 0\" stroke=\"#263442\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><text x=\"85\" y=\"497.0\" font-size=\"29\" fill=\"#263442\">One logical row can involve multiple index records.<\/text><\/svg>", "notes": "A logical row can involve more than one index record. Follow the lookup path: a secondary index leads to the clustered primary-key record. That can mean more locking work than the drawing suggests. A primary key aligned with the query can change that path. The exact effect depends on the schema and query; it is not a universal one-lock guarantee.", "cue": "Optional insert after frame 12. Keep detailed schema in study notes.", "appendix": true}, {"title": "Optional: nothing found can still lock.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Optional: nothing found can still lock.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">OPTIONAL NOTE<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Optional: nothing found can still lock.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">An empty result does not necessarily mean no locks were taken.<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">17<\/text><rect x=\"65\" y=\"240\" width=\"470\" height=\"215\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"85\" y=\"323.0\" font-size=\"28\" fill=\"#ab571c\">Search an empty range<\/text><text x=\"85\" y=\"358.0\" font-size=\"28\" fill=\"#ab571c\"><\/text><text x=\"85\" y=\"393.0\" font-size=\"28\" fill=\"#ab571c\">Range protected<\/text><rect x=\"670\" y=\"240\" width=\"470\" height=\"215\" rx=\"12\" fill=\"#eef3f7\" stroke=\"#263442\" stroke-width=\"2\"/><text x=\"690\" y=\"323.0\" font-size=\"28\" fill=\"#263442\">Refill needs to insert<\/text><text x=\"690\" y=\"358.0\" font-size=\"28\" fill=\"#263442\"><\/text><text x=\"690\" y=\"393.0\" font-size=\"28\" fill=\"#263442\">Waits on that range<\/text><path d=\"M 650 350 l -90 0\" stroke=\"#b13c41\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><\/svg>", "notes": "A locking query may protect the range where matching rows would appear, even when it returns no rows. That can obstruct a refill trying to insert there. Isolation settings affect this behavior. READ COMMITTED avoids the relevant search gap locking, but still has gap locks for some constraint checks. Change isolation for the transaction deliberately, not as a blanket speed switch.", "cue": "Optional insert after frame 12. Do not say READ COMMITTED removes every gap lock.", "appendix": true}, {"title": "Optional: two transactions form a cycle.", "svg": "<svg viewBox=\"0 0 1200 675\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Optional: two transactions form a cycle.\"><rect width=\"1200\" height=\"675\" fill=\"#fcfbf7\"/><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M 1 1 L 9 5 L 1 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/><\/marker><\/defs><text x=\"48\" y=\"46.0\" font-size=\"18\" fill=\"#687583\">OPTIONAL NOTE<\/text><text x=\"48\" y=\"109.0\" font-size=\"40\" fill=\"#263442\">Optional: two transactions form a cycle.<\/text><text x=\"48\" y=\"163.0\" font-size=\"18\" fill=\"#687583\">Shopify checkpoint \u00b7 our illustration<\/text><rect x=\"48\" y=\"544\" width=\"1104\" height=\"80\" rx=\"12\" fill=\"#f7e9df\" stroke=\"#e5c5ae\" stroke-width=\"2\"/><text class=\"question\" x=\"72\" y=\"584.0\" font-size=\"25\" fill=\"#ab571c\">Use consistent lock order, and still handle deadlock retries.<\/text><text x=\"48\" y=\"656.0\" font-size=\"13\" fill=\"#687583\">SYSTEMS FROM FIRST PRINCIPLES   /   TWO BUYERS, ONE LAST PAIR<\/text><text x=\"1100\" y=\"658.0\" font-size=\"17\" fill=\"#687583\">18<\/text><rect x=\"60\" y=\"260\" width=\"440\" height=\"190\" rx=\"12\" fill=\"#eaf2fc\" stroke=\"#2463a0\" stroke-width=\"2\"/><text x=\"80\" y=\"330.5\" font-size=\"28\" fill=\"#2463a0\">T1<\/text><text x=\"80\" y=\"365.5\" font-size=\"28\" fill=\"#2463a0\">Holds row A<\/text><text x=\"80\" y=\"400.5\" font-size=\"28\" fill=\"#2463a0\">Wants row B<\/text><rect x=\"700\" y=\"260\" width=\"440\" height=\"190\" rx=\"12\" fill=\"#fff0de\" stroke=\"#ab571c\" stroke-width=\"2\"/><text x=\"720\" y=\"330.5\" font-size=\"28\" fill=\"#ab571c\">T2<\/text><text x=\"720\" y=\"365.5\" font-size=\"28\" fill=\"#ab571c\">Holds row B<\/text><text x=\"720\" y=\"400.5\" font-size=\"28\" fill=\"#ab571c\">Wants row A<\/text><path d=\"M 515 305 l 170 0\" stroke=\"#2463a0\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><path d=\"M 685 405 l -170 0\" stroke=\"#ab571c\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#tip)\"/><\/svg>", "notes": "Here is a generic deadlock, not Shopify\u2019s exact transaction trace. Transaction one holds A and wants B. Transaction two holds B and wants A. Neither can complete while the other holds its lock. The database can choose a victim and roll back its transaction. A consistent acquisition order reduces these cycles, but we still need retry handling.", "cue": "Generic row-lock example. Avoid describing whole tables as locked.", "appendix": true}];let index=0,revealed=false;const stage=document.getElementById('stage'),notes=document.getElementById('notes'),jump=document.getElementById('jump');slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' · '+s.title;jump.append(o)});function render(){stage.innerHTML=slides[index].svg;stage.classList.toggle('concealed',!revealed);document.getElementById('progress').textContent=(index+1)+' / '+slides.length+(slides[index].appendix?' · optional':'');jump.value=index;notes.textContent='CUE: '+slides[index].cue+'\n\n'+slides[index].notes;location.hash=String(index+1)}function next(){if(!revealed)revealed=true;else if(index<slides.length-1){index++;revealed=false}render()}function prev(){if(revealed)revealed=false;else if(index>0){index--;revealed=true}render()}document.getElementById('next').onclick=()=>{next();stage.focus()};document.getElementById('prev').onclick=()=>{prev();stage.focus()};jump.onchange=()=>{index=Number(jump.value);revealed=false;render();stage.focus()};document.getElementById('noteButton').onclick=()=>notes.hidden=!notes.hidden;document.getElementById('record').onclick=()=>document.body.classList.toggle('recording');document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(['SELECT','BUTTON'].includes(e.target.tagName)&&[' ','ArrowLeft','ArrowRight'].includes(e.key))return;if([' ','ArrowRight','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}else if(e.key.toLowerCase()==='n')notes.hidden=!notes.hidden;else if(e.key.toLowerCase()==='r')document.body.classList.toggle('recording');else if(e.key==='Escape')document.body.classList.remove('recording')});const requested=Number(location.hash.slice(1));if(requested>=1&&requested<=slides.length)index=requested-1;render();</script></html>
